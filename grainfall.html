<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5d5e9c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grainfall">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Grainfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
<style>
/* Layout: a full-screen clay bedroom rendered in WebGL; the mint CRT's screen is the play surface; a glass dock floats over the floor. */
:root{
  --room:#6f70ad; --ink:#f4f2fc; --muted:#c9cae9; --glass:rgba(54,52,104,.52); --line:rgba(230,232,255,.24);
  --mint:#a6e3cc; --mint-deep:#7fcfb2; --pink:#f8cfe1; --moon:#cdd6ff;
  --f-pixel:"Silkscreen", ui-monospace, Menlo, monospace;
  --f-term:"VT323", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse 90% 70% at 50% 40%, #8d8fd0, #5d5e9c 75%), var(--room);color:var(--ink);overflow:hidden;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.loading{position:fixed;inset:0;display:grid;place-items:center;padding-bottom:var(--dockh,200px);font:400 24px/1.2 var(--f-term);color:var(--muted);letter-spacing:.04em;pointer-events:none;transition:opacity .8s ease}
.loading.done{opacity:0}

/* fallback when 3D can't start: the plain screen in a mint bezel */
#flat{position:fixed;inset:0;display:grid;place-items:center;padding:56px max(16px, env(safe-area-inset-left,0px)) var(--dockh,220px)}
.tv2d{padding:16px 16px 30px;border-radius:28px;background:linear-gradient(170deg,#bdeedb,var(--mint-deep));box-shadow:0 24px 50px rgba(30,24,70,.45), inset 0 3px 0 rgba(255,255,255,.5)}
.tv2d canvas{display:block;width:min(88vw, calc((100vh - var(--dockh,220px) - 140px) * 4 / 3));max-width:100%;aspect-ratio:4/3;border-radius:16px;background:#05070a;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none;cursor:crosshair}

.badge{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));display:flex;align-items:baseline;gap:10px;pointer-events:none;text-shadow:0 1px 10px rgba(40,34,90,.55)}
/* back to the Stim Lab homepage (a home-screen web app has no back button) */
.home{position:fixed;z-index:4;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--ink)}
.home svg{width:20px;height:20px}
.home:hover{border-color:rgba(230,232,255,.48)}
.home:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.badge h1{margin:0;font:400 14px/1 var(--f-pixel);letter-spacing:.08em}
.badge span{font:400 19px/1 var(--f-term);color:var(--muted);font-variant-numeric:tabular-nums}
.badge b{font-weight:400;color:var(--ink)}

.dock{position:fixed;left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);box-shadow:0 18px 40px rgba(28,22,70,.35)}
.palette{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:4px}
.chip{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;padding:6px 2px 5px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.06);color:var(--ink);font:400 16px/1 var(--f-term);cursor:pointer}
.chip canvas{display:block;width:100%;height:7px;border-radius:2px;image-rendering:crisp-edges;image-rendering:pixelated}
.chip span{display:block;white-space:nowrap;overflow:hidden;text-align:center}
.chip:hover{border-color:rgba(230,232,255,.45)}
.chip[aria-pressed="true"]{border-color:var(--mint);background:rgba(166,227,204,.2);box-shadow:0 0 14px rgba(166,227,204,.32)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.note{flex:1 1 280px;min-width:0;margin:0;font:400 18px/1.15 var(--f-term);color:var(--muted)}
.note b{color:var(--ink);font-weight:400;margin-right:6px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lbl{font:400 10px/1 var(--f-pixel);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#brush{width:104px;accent-color:var(--mint)}
.val{font:400 19px/1 var(--f-term);min-width:1.2ch;font-variant-numeric:tabular-nums}
.btn{font:400 10px/1 var(--f-pixel);letter-spacing:.06em;text-transform:uppercase;padding:9px 11px;min-height:34px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.08);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:rgba(230,232,255,.48)}
.btn[aria-pressed="true"]{background:var(--mint);color:#1f3b33;border-color:var(--mint)}
.btn:focus-visible,.chip:focus-visible,#brush:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
@media (pointer:coarse){.chip{min-height:44px}.btn{min-height:42px}}
@media (max-width:1060px){.palette{grid-template-columns:repeat(9,minmax(0,1fr))}}
@media (max-width:560px){.palette{grid-template-columns:repeat(6,minmax(0,1fr))}.note{font-size:16px}.dock{padding:8px;gap:6px}}
</style>
</head>
<body>

<canvas id="gl" aria-label="A clay bedroom with a mint CRT. Draw on the TV screen, drag the room to look around."></canvas>
<div id="flat" hidden><div class="tv2d"></div></div>
<div class="loading" id="loading">Building the room…</div>

<a class="home" href="./" aria-label="Back to Stim Lab" title="Stim Lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></a>
<header class="badge"><h1>Grainfall</h1><span><b id="dots">0</b> dots</span></header>

<section class="dock" id="dock" aria-label="Materials and tools">
  <div class="palette" id="palette" role="toolbar" aria-label="Materials"></div>
  <div class="row">
    <p class="note" id="note"></p>
    <div class="tools">
      <label for="brush" class="lbl">Brush</label>
      <input type="range" id="brush" min="1" max="8" value="2">
      <span id="brushVal" class="val">2</span>
      <button id="pause" class="btn" type="button" aria-pressed="false">Pause</button>
      <button id="clear" class="btn" type="button">Clear</button>
      <button id="demo" class="btn" type="button">Demo</button>
      <button id="air" class="btn" type="button" aria-pressed="false">Air view</button>
      <button id="zoom" class="btn" type="button" aria-pressed="false">Zoom in</button>
    </div>
  </div>
</section>

<script>
/* ---------- the sandbox: runs on its own, the 3D room just shows it ---------- */
(() => {
"use strict";
const $ = id => document.getElementById(id);
/* ---------- materials ---------- */
const EMPTY=0,WALL=1,SAND=2,WATER=3,OIL=4,FIRE=5,PLANT=6,POWDER=7,ICE=8,LAVA=9,STONE=10,STEAM=11,SMOKE=12,ACID=13,WIRE=14,SPARK=15,WOOD=16,SPOUT=17;
const WIND=100,ERASE=101,N=18;
const SOLID=1,PWD=2,LIQ=3,GAS=4;
const KIND=new Uint8Array(N),DENS=new Uint8Array(N),FLOW=new Uint8Array(N),FOOD=new Uint8Array(N);
const MOB=new Float32Array(N),FLAM=new Float32Array(N);
function def(t,k,d,m,f,fl){KIND[t]=k;DENS[t]=d;MOB[t]=m;FLAM[t]=f;FLOW[t]=fl||0;}
def(WALL,SOLID,255,0,0); def(WOOD,SOLID,255,0,.035); def(PLANT,SOLID,255,0,.08);
def(ICE,SOLID,255,0,0); def(WIRE,SOLID,255,0,0); def(SPOUT,SOLID,255,0,0);
def(SAND,PWD,10,.5,0); def(STONE,PWD,12,.22,0); def(POWDER,PWD,9,.6,.9);
def(WATER,LIQ,5,.35,0,4); def(OIL,LIQ,3,.42,.12,3); def(ACID,LIQ,6,.35,0,3); def(LAVA,LIQ,8,.08,0,1);
def(FIRE,GAS,1,1.1,0); def(STEAM,GAS,1,1.2,0); def(SMOKE,GAS,1,1.4,0); def(SPARK,GAS,1,.8,0);
[SAND,STONE,WOOD,PLANT,WIRE,ICE,POWDER].forEach(t=>FOOD[t]=1);

const TOOLS=[
  [SAND,'Sand','Falls and piles up. Sinks through water and oil.'],
  [STONE,'Stone','Heavy grit that piles steeply. Lava turns into it when water hits.'],
  [POWDER,'Powder','Gunpowder. Explodes near fire, lava or a charged wire and throws a pressure wave.'],
  [WATER,'Water','Flows and levels out. Douses fire, hardens lava, feeds plants.'],
  [OIL,'Oil','Floats on water. Burns long once it catches.'],
  [ACID,'Acid','Eats sand, stone, wood, plants, wire and ice, and gets used up doing it.'],
  [LAVA,'Lava','Slow and glowing. Lights fuel, melts ice, turns to stone in water.'],
  [FIRE,'Fire','Rises and burns out. Spreads to wood, plants, oil and gunpowder.'],
  [SPARK,'Spark','Tap a copper wire to send a pulse along it. Also lights fuel.'],
  [STEAM,'Steam','Rises and drifts, then condenses back into water.'],
  [WALL,'Wall','Indestructible. Also blocks the wind.'],
  [WOOD,'Wood','Solid fuel. Burns from the outside in.'],
  [PLANT,'Plant','Grows into any water it touches. Burns fast.'],
  [ICE,'Ice','Slowly freezes water it touches. Melts near heat.'],
  [WIRE,'Wire','Copper. Carries spark pulses, and closed loops keep pulsing.'],
  [SPOUT,'Spout','Copies the first loose material that touches it and pours it out forever.'],
  [WIND,'Wind','Drag across the screen to push the air and everything loose in it. Tap for a puff.'],
  [ERASE,'Erase','Clears whatever is under the brush.'],
];

/* ---------- colors ---------- */
const clamp8=v=>v<0?0:v>255?255:Math.round(v);
const rgb=(r,g,b)=>((255<<24)|(clamp8(b)<<16)|(clamp8(g)<<8)|clamp8(r))>>>0;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const BGc=[7,10,14], BG=rgb(...BGc);
const RAMP={
  [WALL]:[[84,89,102],[108,113,126]], [SAND]:[[203,162,92],[240,208,142]], [STONE]:[[112,108,104],[150,146,140]],
  [POWDER]:[[44,43,50],[88,86,94]], [WATER]:[[34,88,206],[72,142,242]], [OIL]:[[96,66,26],[140,104,44]],
  [ACID]:[[118,214,52],[176,250,96]], [LAVA]:[[205,52,18],[255,170,50]], [PLANT]:[[38,136,58],[102,200,90]],
  [WOOD]:[[104,66,36],[146,98,58]], [ICE]:[[160,212,238],[206,236,250]], [WIRE]:[[164,96,44],[212,140,78]],
  [SPOUT]:[[30,96,104],[50,134,142]], [SPARK]:[[255,236,150],[255,252,220]], [STEAM]:[[180,192,206],[214,222,232]],
  [SMOKE]:[[56,56,64],[84,84,92]], [FIRE]:[[255,120,30],[255,210,90]],
};
const PAL=new Uint32Array(N*8), MID=[];
for(const k in RAMP){
  const t=+k,[a,b]=RAMP[k];
  for(let s=0;s<8;s++) PAL[t*8+s]=rgb(...mix(a,b,s/7));
  MID[t]=mix(a,b,.6);
}
const FIRE_LUT=new Uint32Array(48);
const FST=[[0,[70,12,10]],[12,[176,34,12]],[24,[238,96,22]],[36,[255,184,60]],[47,[255,246,200]]];
for(let i=0;i<48;i++){
  let s=0; while(s<FST.length-2&&i>FST[s+1][0]) s++;
  const [i0,c0]=FST[s],[i1,c1]=FST[s+1];
  FIRE_LUT[i]=rgb(...mix(c0,c1,(i-i0)/(i1-i0)));
}
const STEAM_LUT=new Uint32Array(16), SMOKE_LUT=new Uint32Array(16);
for(let k=0;k<16;k++){
  STEAM_LUT[k]=rgb(...mix(BGc,[206,216,228],.12+.7*k/15));
  SMOKE_LUT[k]=rgb(...mix(BGc,[74,74,84],.15+.8*k/15));
}
const WIRE_HEAD=rgb(255,246,204), WIRE_TAIL=rgb(255,166,84);
const SPOUT_T=new Uint32Array(N*2);
for(let t=1;t<N;t++){ if(!MID[t]) continue;
  SPOUT_T[t*2]=rgb(...mix(RAMP[SPOUT][0],MID[t],.45));
  SPOUT_T[t*2+1]=rgb(...mix(RAMP[SPOUT][1],MID[t],.55));
}

/* ---------- grid ---------- */
const W=160,H=120,AW=W>>2,AH=H>>2;
const type=new Uint8Array(W*H), life=new Uint8Array(W*H), shade=new Uint8Array(W*H), stamp=new Uint16Array(W*H);
let vx=new Float32Array(AW*AH), vy=new Float32Array(AW*AH), tx=new Float32Array(AW*AH), ty=new Float32Array(AW*AH);
let p=new Float32Array(AW*AH), tp=new Float32Array(AW*AH);
const blocked=new Uint8Array(AW*AH), bcount=new Uint8Array(AW*AH), airCol=new Uint32Array(AW*AH);
const cv=document.createElement('canvas'); cv.width=160; cv.height=120; const ctx=cv.getContext('2d');
const img=ctx.createImageData(W,H), px=new Uint32Array(img.data.buffer);
let frame=0,clock=0,renders=0,paused=false,airView=false,tool=SAND,brushR=1;

function setCell(i,t){
  type[i]=t; shade[i]=Math.random()*8|0; stamp[i]=clock;
  switch(t){
    case FIRE: life[i]=18+(Math.random()*22|0); break;
    case STEAM: life[i]=110+(Math.random()*140|0); break;
    case SMOKE: life[i]=50+(Math.random()*70|0); break;
    case SPARK: life[i]=5+(Math.random()*6|0); break;
    default: life[i]=0;
  }
}
function clear(i){ type[i]=EMPTY; life[i]=0; stamp[i]=clock; }
function swap(i,j){
  let a=type[i]; type[i]=type[j]; type[j]=a;
  a=life[i]; life[i]=life[j]; life[j]=a;
  a=shade[i]; shade[i]=shade[j]; shade[j]=a;
  stamp[i]=clock; stamp[j]=clock;
}
function enterable(i,j){
  const tj=type[j];
  if(tj===EMPTY) return true;
  if(KIND[tj]===SOLID) return false;
  if(tj===FIRE&&(life[j]&128)) return false;
  return DENS[type[i]]>DENS[tj];
}
function tryMove(i,x,y){
  if(x<0||x>=W||y<0||y>=H) return false;
  const j=y*W+x;
  if(enterable(i,j)){ swap(i,j); return true; }
  return false;
}
function nbr(x,y,r){
  if(r===0) x++; else if(r===1) x--; else if(r===2) y++; else y--;
  if(x<0||x>=W||y<0||y>=H) return -1;
  return y*W+x;
}
function windPush(i,x,y,t){
  const a=(y>>2)*AW+(x>>2), m=MOB[t];
  const wx=vx[a]*m; let wy=vy[a]*m;
  if(wx*wx+wy*wy<0.01) return false;
  const k=KIND[t];
  wy+=(k===PWD||k===LIQ)?0.35:(t===SPARK?0:-0.25);
  let dx=0,dy=0;
  if(Math.random()<Math.abs(wx)) dx=wx>0?1:-1;
  if(Math.random()<Math.abs(wy)) dy=wy>0?1:-1;
  if(!dx&&!dy) return false;
  if(tryMove(i,x+dx,y+dy)) return true;
  if(dx&&dy){ if(tryMove(i,x+dx,y)) return true; if(tryMove(i,x,y+dy)) return true; }
  return false;
}
function blast(x,y,s){ const a=(y>>2)*AW+(x>>2); p[a]=Math.min(14,p[a]+s); }
function ignite(j){
  const t=type[j];
  type[j]=FIRE; shade[j]=Math.random()*8|0; stamp[j]=clock;
  if(t===POWDER){ life[j]=14+(Math.random()*16|0); blast(j%W,(j/W)|0,2.2); }
  else if(t===WOOD) life[j]=128|(70+(Math.random()*50|0));
  else if(t===PLANT) life[j]=128|(14+(Math.random()*18|0));
  else if(t===OIL) life[j]=128|(30+(Math.random()*40|0));
  else life[j]=20;
}

/* ---------- behaviours ---------- */
function powder(i,x,y,t){
  if(windPush(i,x,y,t)) return;
  if(tryMove(i,x,y+1)) return;
  if(t===STONE&&Math.random()<0.65) return;
  const d=Math.random()<0.5?-1:1;
  if(tryMove(i,x+d,y+1)) return;
  tryMove(i,x-d,y+1);
}
function spread(i,x,y,d,f){
  let best=-1;
  for(let k=1;k<=f;k++){
    const xx=x+d*k; if(xx<0||xx>=W) break;
    const j=y*W+xx;
    if(enterable(i,j)) best=j; else break;
  }
  if(best>=0){ swap(i,best); return true; }
  return false;
}
function liquid(i,x,y,t){
  const j=nbr(x,y,Math.random()*4|0);
  if(j>=0){
    const tj=type[j];
    if(t===WATER){
      if(tj===LAVA){ setCell(i,STEAM); if(Math.random()<0.5) setCell(j,STONE); return; }
    } else if(t===LAVA){
      if(tj===WATER){ setCell(j,STEAM); if(Math.random()<0.5){ setCell(i,STONE); return; } }
      else if(FLAM[tj]>0){ if(Math.random()<0.5) ignite(j); }
      else if(tj===ICE){ setCell(j,WATER); }
    } else if(t===ACID){
      if(FOOD[tj]&&Math.random()<0.1){
        if(Math.random()<0.2) setCell(j,SMOKE); else clear(j);
        if(Math.random()<0.35){ clear(i); return; }
      }
    }
  }
  if(t===LAVA){
    if(y>0&&Math.random()<0.004&&type[i-W]===EMPTY) setCell(i-W,FIRE);
    if(Math.random()<0.55) return;
  }
  if(windPush(i,x,y,t)) return;
  if(tryMove(i,x,y+1)) return;
  const d=Math.random()<0.5?-1:1;
  if(tryMove(i,x+d,y+1)) return;
  if(tryMove(i,x-d,y+1)) return;
  if(spread(i,x,y,d,FLOW[t])) return;
  spread(i,x,y,-d,FLOW[t]);
}
function fire(i,x,y){
  const l=life[i], anch=l&128; let n=l&127;
  for(let r=0;r<4;r++){
    const j=nbr(x,y,r); if(j<0) continue;
    const tj=type[j];
    if(FLAM[tj]>0){ if(Math.random()<FLAM[tj]) ignite(j); }
    else if(tj===WATER){ if(Math.random()<0.5) setCell(j,STEAM); clear(i); return; }
    else if(tj===ICE){ if(Math.random()<0.08) setCell(j,WATER); }
  }
  n-=anch?(Math.random()<0.6?1:0):1;
  if(n<=0){ if(Math.random()<(anch?0.6:0.12)) setCell(i,SMOKE); else clear(i); return; }
  life[i]=anch|n;
  vy[(y>>2)*AW+(x>>2)]-=0.001;
  if(anch){
    if(y>0&&Math.random()<0.35&&type[i-W]===EMPTY){ setCell(i-W,FIRE); life[i-W]=6+(Math.random()*12|0); }
    return;
  }
  if(windPush(i,x,y,FIRE)) return;
  const dx=(Math.random()*3|0)-1;
  if(Math.random()<0.8&&tryMove(i,x+dx,y-1)) return;
  tryMove(i,x+dx,y);
}
function gas(i,x,y,t){
  let l=life[i]; if(l>0) l--;
  if(l===0){ if(t===STEAM&&Math.random()<0.45) setCell(i,WATER); else clear(i); return; }
  life[i]=l;
  if(windPush(i,x,y,t)) return;
  const d=Math.random()<0.5?-1:1, r=Math.random();
  if(r<0.7&&tryMove(i,x+(Math.random()<0.5?0:d),y-1)) return;
  if(r<0.9) tryMove(i,x+d,y);
}
function spark(i,x,y){
  const hc=20+(frame&1);
  for(let r=0;r<4;r++){
    const j=nbr(x,y,r); if(j<0) continue;
    const tj=type[j];
    if(tj===WIRE){ if(life[j]===0) life[j]=hc; }
    else if(FLAM[tj]>0&&Math.random()<0.5) ignite(j);
  }
  const l=life[i]-1;
  if(l<=0){ clear(i); return; }
  life[i]=l;
  if(windPush(i,x,y,SPARK)) return;
  const r=Math.random()*4|0;
  tryMove(i,x+(r===0?1:r===1?-1:0),y+(r===2?1:r===3?-1:0));
}
/* wire pulse heads are stamped with frame parity so a pulse moves one cell per frame */
function wire(i,x,y,c){
  const l=life[i], hOld=20+(c^1), hCur=20+c, tOld=30+(c^1), tCur=30+c;
  if(l===hOld){
    life[i]=tCur;
    for(let r=0;r<4;r++){ const j=nbr(x,y,r); if(j>=0&&FLAM[type[j]]>0&&Math.random()<0.7) ignite(j); }
    return;
  }
  if(l===hCur||l===tCur) return;
  if(l===tOld){ life[i]=3; return; }
  if(l>0){ life[i]=l-1; return; }
  for(let dy=-1;dy<=1;dy++){
    const yy=y+dy; if(yy<0||yy>=H) continue;
    for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const xx=x+dx; if(xx<0||xx>=W) continue;
      const j=yy*W+xx;
      if(type[j]===WIRE){ const lj=life[j]; if(lj===hOld||lj===tCur){ life[i]=hCur; return; } }
    }
  }
}
function spout(i,x,y){
  const c=life[i];
  if(c===0){
    for(let r=0;r<4;r++){ const j=nbr(x,y,r); if(j<0) continue; const tj=type[j];
      if(tj!==EMPTY&&KIND[tj]!==SOLID){ life[i]=tj; return; } }
    return;
  }
  if(Math.random()<0.18){ const j=nbr(x,y,Math.random()*4|0); if(j>=0&&type[j]===EMPTY) setCell(j,c); }
}
/* ---------- air ---------- */
function computeBlocked(){
  bcount.fill(0);
  for(let y=0;y<H;y++){ const ar=(y>>2)*AW, row=y*W;
    for(let x=0;x<W;x++) if(KIND[type[row+x]]===SOLID) bcount[ar+(x>>2)]++; }
  for(let a=0;a<AW*AH;a++) blocked[a]=bcount[a]>=9?1:0;
}
function stepAir(){
  if((frame&7)===0) computeBlocked();
  const k=0.25, aw=AW, ah=AH;
  for(let y=0;y<ah;y++){ const row=y*aw;
    for(let x=0;x<aw;x++){ const a=row+x;
      if(blocked[a]){ p[a]=0; continue; }
      const l=x>0?vx[a-1]:0, r=x<aw-1?vx[a+1]:0, u=y>0?vy[a-aw]:0, d=y<ah-1?vy[a+aw]:0;
      p[a]-=(r-l+d-u)*k; } }
  for(let y=0;y<ah;y++){ const row=y*aw;
    for(let x=0;x<aw;x++){ const a=row+x;
      if(blocked[a]){ vx[a]=0; vy[a]=0; continue; }
      const c=p[a];
      const pl=(x>0&&!blocked[a-1])?p[a-1]:c, pr=(x<aw-1&&!blocked[a+1])?p[a+1]:c;
      const pu=(y>0&&!blocked[a-aw])?p[a-aw]:c, pd=(y<ah-1&&!blocked[a+aw])?p[a+aw]:c;
      vx[a]-=(pr-pl)*k; vy[a]-=(pd-pu)*k; } }
  const mx=aw-1.001, my=ah-1.001;
  for(let y=0;y<ah;y++){ const row=y*aw;
    for(let x=0;x<aw;x++){ const a=row+x;
      if(blocked[a]){ tx[a]=0; ty[a]=0; tp[a]=0; continue; }
      let bx=x-vx[a]*0.3, by=y-vy[a]*0.3;
      bx=bx<0?0:bx>mx?mx:bx; by=by<0?0:by>my?my:by;
      const x0=bx|0, y0=by|0, fx=bx-x0, fy=by-y0;
      const a00=y0*aw+x0, a10=a00+1, a01=a00+aw, a11=a01+1;
      const w00=(1-fx)*(1-fy), w10=fx*(1-fy), w01=(1-fx)*fy, w11=fx*fy;
      let sx=vx[a00]*w00+vx[a10]*w10+vx[a01]*w01+vx[a11]*w11;
      let sy=vy[a00]*w00+vy[a10]*w10+vy[a01]*w01+vy[a11]*w11;
      const nl=x>0?a-1:a, nr=x<aw-1?a+1:a, nu=y>0?a-aw:a, nd=y<ah-1?a+aw:a;
      sx=(sx*0.84+(vx[nl]+vx[nr]+vx[nu]+vx[nd])*0.04)*0.993;
      sy=(sy*0.84+(vy[nl]+vy[nr]+vy[nu]+vy[nd])*0.04)*0.993;
      if((x===0&&sx<0)||(x===aw-1&&sx>0)) sx=0;
      if((y===0&&sy<0)||(y===ah-1&&sy>0)) sy=0;
      tx[a]=sx>4?4:sx<-4?-4:sx; ty[a]=sy>4?4:sy<-4?-4:sy;
      const q=(p[a]*0.8+(p[nl]+p[nr]+p[nu]+p[nd])*0.05)*0.985;
      tp[a]=q>14?14:q<-14?-14:q; } }
  let s=vx; vx=tx; tx=s; s=vy; vy=ty; ty=s; s=p; p=tp; tp=s;
}

/* ---------- step ---------- */
function step(){
  frame++; clock++;
  if(clock>65535){ stamp.fill(0); clock=1; }
  const c=frame&1;
  stepAir();
  for(let y=H-1;y>=0;y--){
    const row=y*W, ltr=Math.random()<0.5;
    for(let k=0;k<W;k++){
      const x=ltr?k:W-1-k, i=row+x, t=type[i];
      if(t===EMPTY||t===WALL||t===WOOD||stamp[i]===clock) continue;
      switch(t){
        case SAND: case STONE: case POWDER: powder(i,x,y,t); break;
        case WATER: case OIL: case ACID: case LAVA: liquid(i,x,y,t); break;
        case FIRE: fire(i,x,y); break;
        case STEAM: case SMOKE: gas(i,x,y,t); break;
        case SPARK: spark(i,x,y); break;
        case PLANT:
          if(Math.random()<0.08){ const j=nbr(x,y,Math.random()*4|0); if(j>=0&&type[j]===WATER) setCell(j,PLANT); }
          break;
        case ICE:
          if(Math.random()<0.06){ const j=nbr(x,y,Math.random()*4|0);
            if(j>=0){ const tj=type[j]; if(tj===WATER){ if(Math.random()<0.15) setCell(j,ICE); } else if(tj===STEAM) setCell(j,WATER); } }
          break;
        case WIRE: wire(i,x,y,c); break;
        case SPOUT: spout(i,x,y); break;
      }
    }
  }
}

/* ---------- render ---------- */
const dotsEl=$('dots');
let spR=80,spG=96,spB=150;
function render(){
  let n=0; const av=airView;
  if(av){
    for(let a=0;a<AW*AH;a++){
      if(blocked[a]){ airCol[a]=BG; continue; }
      const q=p[a], s=Math.min(4,Math.hypot(vx[a],vy[a]));
      let r=7,g=10,b=14;
      if(q>0){ r+=q*26; g+=q*9; } else { b-=q*30; g-=q*12; }
      r+=s*8; g+=s*22; b+=s*30;
      airCol[a]=rgb(r,g,b);
    }
  }
  for(let y=0;y<H;y++){ const row=y*W, ar=(y>>2)*AW;
    for(let x=0;x<W;x++){ const i=row+x, t=type[i];
      if(t===EMPTY){ px[i]=av?airCol[ar+(x>>2)]:BG; continue; }
      n++;
      switch(t){
        case FIRE:{ const l=life[i]; px[i]=(l&128)?FIRE_LUT[20+(Math.random()*26|0)]:FIRE_LUT[Math.min(47,(l&127)+(Math.random()*8|0))]; break; }
        case STEAM: px[i]=STEAM_LUT[Math.min(15,life[i]>>3)]; break;
        case SMOKE: px[i]=SMOKE_LUT[Math.min(15,life[i]>>2)]; break;
        case WIRE:{ const l=life[i]; px[i]=(l===20||l===21)?WIRE_HEAD:(l>=30||(l>0&&l<4))?WIRE_TAIL:PAL[WIRE*8+shade[i]]; break; }
        case SPOUT:{ const cl=life[i], k=(x+y)&1; px[i]=cl?SPOUT_T[cl*2+k]:PAL[SPOUT*8+k*7]; break; }
        case LAVA: if(Math.random()<0.03) shade[i]=Math.random()*8|0; px[i]=PAL[LAVA*8+shade[i]]; break;
        case WATER: if(Math.random()<0.004) shade[i]=Math.random()*8|0; px[i]=PAL[WATER*8+shade[i]]; break;
        default: px[i]=PAL[t*8+shade[i]];
      }
    }
  }
  ctx.putImageData(img,0,0);
  if((renders++&7)===0){ dotsEl.textContent=n.toLocaleString(); spill(); }
}
/* the room picks up the screen's average hue, brighter when the screen is busier */
function spill(){
  let r=0,g=0,b=0,k=0;
  for(let i=0;i<W*H;i+=13){ const c=px[i]; r+=c&255; g+=(c>>>8)&255; b+=(c>>>16)&255; k++; }
  r/=k; g/=k; b/=k;
  const m=Math.max(r,g,b,1), I=Math.min(190,30+(r+g+b)/3*5);
  spR+=(Math.min(255,30+r/m*I)-spR)*.4; spG+=(Math.min(255,36+g/m*I)-spG)*.4; spB+=(Math.min(255,62+b/m*I)-spB)*.4;
  GF.spill[0]=spR/255; GF.spill[1]=spG/255; GF.spill[2]=spB/255;
}

/* ---------- input on the screen ---------- */
const ptr={down:false,id:-1,x:0,y:0};
function paintAt(cx,cy){
  const r=brushR, r2=r*r+r, t=tool;
  for(let dy=-r;dy<=r;dy++){ const y=cy+dy; if(y<0||y>=H) continue;
    for(let dx=-r;dx<=r;dx++){
      if(dx*dx+dy*dy>r2) continue;
      const x=cx+dx; if(x<0||x>=W) continue;
      const i=y*W+x;
      if(t===ERASE){ type[i]=EMPTY; life[i]=0; continue; }
      const ti=type[i];
      if(t===SPARK){
        if(ti===WIRE){ if(life[i]===0) life[i]=20+(frame&1); }
        else if(ti===EMPTY&&Math.random()<0.12) setCell(i,SPARK);
        continue;
      }
      if(ti!==EMPTY) continue;
      if(KIND[t]===SOLID||r===0||Math.random()<(KIND[t]===GAS?0.35:0.28)) setCell(i,t);
    }
  }
}
function strokeTo(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0, dist=Math.max(Math.abs(dx),Math.abs(dy));
  const n=Math.max(1,Math.ceil(dist/Math.max(1,brushR)));
  for(let s=1;s<=n;s++) paintAt(Math.round(x0+dx*s/n),Math.round(y0+dy*s/n));
}
function addWind(gx,gy,dx,dy){
  const ax=gx/4, ay=gy/4, R=1.3+brushR/4, R2=R*R, k=0.07;
  const x0=Math.max(0,Math.floor(ax-R)), x1=Math.min(AW-1,Math.ceil(ax+R));
  const y0=Math.max(0,Math.floor(ay-R)), y1=Math.min(AH-1,Math.ceil(ay+R));
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const ddx=x+.5-ax, ddy=y+.5-ay, d2=ddx*ddx+ddy*ddy;
    if(d2>R2) continue;
    const a=y*AW+x; if(blocked[a]) continue;
    const f=1-d2/R2;
    vx[a]=Math.max(-4,Math.min(4,vx[a]+dx*k*f));
    vy[a]=Math.max(-4,Math.min(4,vy[a]+dy*k*f));
  }
}
function windStroke(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0, d=Math.hypot(dx,dy);
  if(d<0.05) return;
  const n=Math.max(1,Math.ceil(d/4));
  for(let s=1;s<=n;s++) addWind(x0+dx*s/n,y0+dy*s/n,dx*2,dy*2);
}
function puff(gx,gy){
  const ax=Math.max(0,Math.min(AW-1,gx>>2)), ay=Math.max(0,Math.min(AH-1,gy>>2));
  for(let y=ay-1;y<=ay+1;y++) for(let x=ax-1;x<=ax+1;x++){
    if(x<0||y<0||x>=AW||y>=AH) continue;
    const a=y*AW+x; if(blocked[a]) continue;
    p[a]=Math.min(14,p[a]+(x===ax&&y===ay?5:2));
  }
}

/* ---------- palette & controls ---------- */
const palette=$('palette'), note=$('note'), chips={};
function drawSwatch(c,t){
  const w=24,h=8; c.width=w; c.height=h;
  const g=c.getContext('2d'), im=g.createImageData(w,h), u=new Uint32Array(im.data.buffer);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const r=Math.random(); let col;
    if(t===FIRE) col=FIRE_LUT[Math.max(0,Math.min(47,47-y*5-(r*10|0)))];
    else if(t===STEAM) col=STEAM_LUT[6+(r*10|0)];
    else if(t===WIND) col=((y===1&&x%8<5)||(y===4&&(x+3)%8<6)||(y===6&&(x+5)%9<4))?rgb(127,182,230):BG;
    else if(t===ERASE) col=(((x>>2)+(y>>2))&1)?rgb(40,44,54):rgb(24,27,35);
    else if(t===SPOUT) col=PAL[SPOUT*8+((((x>>1)+(y>>1))&1)*7)];
    else if(t===WIRE) col=(y===3||y===4)?PAL[WIRE*8+(r*8|0)]:BG;
    else if(t===SPARK) col=r<0.2?PAL[SPARK*8+((r*40|0)&7)]:BG;
    else col=PAL[t*8+(r*8|0)];
    u[y*w+x]=col;
  }
  g.putImageData(im,0,0);
}
function describe(t){ const e=TOOLS.find(d=>d[0]===t); note.innerHTML='<b>'+e[1]+'</b>'+e[2]; }
function select(t,quiet){
  tool=t;
  for(const k in chips) chips[k].setAttribute('aria-pressed',String(+k===t));
  if(!quiet){ describe(t); save(); }
}
for(const [t,name,desc] of TOOLS){
  const b=document.createElement('button');
  b.type='button'; b.className='chip'; b.id='tool-'+name.toLowerCase(); b.title=desc; b.setAttribute('aria-pressed','false');
  const c=document.createElement('canvas'); c.setAttribute('aria-hidden','true'); drawSwatch(c,t);
  const s=document.createElement('span'); s.textContent=name;
  b.append(c,s); b.addEventListener('click',()=>select(t));
  palette.append(b); chips[t]=b;
}
const pauseBtn=$('pause'), airBtn=$('air'), zoomBtn=$('zoom'), brushIn=$('brush'), brushVal=$('brushVal');
pauseBtn.addEventListener('click',()=>{ paused=!paused; pauseBtn.textContent=paused?'Run':'Pause'; pauseBtn.setAttribute('aria-pressed',String(paused)); });
$('clear').addEventListener('click',wipe);
$('demo').addEventListener('click',()=>{ demo(); showDemoHint(); });
airBtn.addEventListener('click',()=>{ airView=!airView; airBtn.setAttribute('aria-pressed',String(airView)); });
brushIn.addEventListener('input',()=>{ brushR=(+brushIn.value)-1; brushVal.textContent=brushIn.value; save(); });
document.addEventListener('keydown',e=>{ if(e.code==='Space'&&(e.target===document.body||e.target===cv)){ e.preventDefault(); pauseBtn.click(); } });

const KEY='grainfall:prefs';
let zoomT=0;
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({tool,brush:brushR+1,zoom:zoomT})); }catch(_){} }
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s){
      if(TOOLS.some(d=>d[0]===s.tool)) tool=s.tool;
      const b=+s.brush; if(b>=1&&b<=8){ brushR=b-1; brushIn.value=String(b); brushVal.textContent=String(b); }
      if(s.zoom===1) zoomT=1;
    }
  }catch(_){}
}

/* ---------- scenes ---------- */
function wipe(){ type.fill(0); life.fill(0); vx.fill(0); vy.fill(0); tx.fill(0); ty.fill(0); p.fill(0); tp.fill(0); blocked.fill(0); }
function showDemoHint(){ note.innerHTML='<b>Demo</b>Pick Spark and tap the copper wire to set off the gunpowder. Drag the room to look around.'; }
function demo(){
  wipe();
  const X=f=>Math.max(0,Math.min(W-1,Math.round(f*W))), Y=f=>Math.max(0,Math.min(H-1,Math.round(f*H)));
  const fill=(x0,y0,x1,y1,t)=>{ for(let y=Math.max(0,y0);y<=Math.min(H-1,y1);y++) for(let x=Math.max(0,x0);x<=Math.min(W-1,x1);x++) setCell(y*W+x,t); };
  const ground=Y(.95);
  fill(0,ground,W-1,H-1,STONE);
  const lx0=X(.04), lx1=X(.24), pit=Y(.80);
  fill(lx0-2,pit,lx0-1,ground-1,WALL); fill(lx1+1,pit,lx1+2,ground-1,WALL);
  fill(lx0,Y(.86),lx1,ground-1,LAVA);
  fill(X(.06),Y(.24),X(.21),Y(.27),ICE);
  const bx0=X(.31), bx1=X(.62), bTop=Y(.50);
  fill(bx0-2,bTop,bx0-1,ground-1,WALL); fill(bx1+1,bTop,bx1+2,ground-1,WALL);
  fill(bx0,Y(.62),bx1,ground-1,WATER);
  fill(bx0,Y(.56),bx1,Y(.62)-1,OIL);
  fill(bx0,Y(.72),bx0+1,Y(.76),PLANT);
  const sx=X(.47), sy=Y(.07);
  fill(sx-1,sy,sx+1,sy+1,SPOUT);
  for(let y=sy;y<=sy+1;y++) for(let x=sx-1;x<=sx+1;x++) life[y*W+x]=SAND;
  const wx0=X(.70), wx1=X(.96), shelf=Y(.64);
  fill(wx0,shelf,wx1,shelf+2,WOOD);
  fill(wx0+2,shelf+3,wx0+4,ground-1,WOOD); fill(wx1-4,shelf+3,wx1-2,ground-1,WOOD);
  const cx=(wx0+wx1)>>1, half=(wx1-wx0)>>1, hgt=Math.max(6,Y(.11));
  for(let k=0;k<hgt;k++){ const w=Math.round(half*(1-k/hgt)); fill(cx-w,shelf-1-k,cx+w,shelf-1-k,POWDER); }
  const wy=Y(.30);
  fill(X(.66),wy,X(.98),wy+1,WIRE);
  fill(cx,wy,cx+1,shelf-1-hgt,WIRE);
  computeBlocked();
}
/* ---------- input API: the 3D room maps touches onto the screen and calls these ---------- */
function gDown(gx,gy){ ptr.down=true; ptr.x=gx; ptr.y=gy; if(tool===WIND) puff(gx|0,gy|0); else paintAt(gx|0,gy|0); }
function gMove(gx,gy){ if(!ptr.down) return; if(tool===WIND) windStroke(ptr.x,ptr.y,gx,gy); else strokeTo(ptr.x|0,ptr.y|0,gx|0,gy|0); ptr.x=gx; ptr.y=gy; }
function gUp(){ ptr.down=false; }
function held(){ if(ptr.down&&tool!==WIND) paintAt(ptr.x|0,ptr.y|0); }
function setZoom(z,quiet){ zoomT=z; GF.zoom=z; zoomBtn.textContent=z?'Zoom out':'Zoom in'; zoomBtn.setAttribute('aria-pressed',String(!!z)); if(!quiet) save(); }
zoomBtn.addEventListener('click',()=>setZoom(zoomT?0:1));

const dock=$('dock'), loadingEl=$('loading'), flat=$('flat');
const GF = window.GF = {
  W, H, cv, mode:'pending', zoom:0, spill:[.45,.55,.9],
  down:gDown, move:gMove, up:gUp,
  availH(){ return Math.max(200, dock.getBoundingClientRect().top-8); },
  ready3d(){ if(GF.mode==='2d') return false; GF.mode='3d'; loadingEl.classList.add('done'); return true; },
  use2d(){
    if(GF.mode!=='pending') return;
    GF.mode='2d';
    $('gl').hidden=true; loadingEl.classList.add('done'); zoomBtn.hidden=true;
    cv.setAttribute('aria-label','Sandbox screen. Drag to pour the selected material.');
    flat.querySelector('.tv2d').append(cv); flat.hidden=false;
    note.innerHTML='<b>Flat mode</b>The 3D room could not start here, so this is the screen on its own.';
  },
};

/* flat fallback: plain pointer mapping onto the canvas */
let flatId=-1;
const toG=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]; };
cv.addEventListener('pointerdown',e=>{ if(GF.mode!=='2d'||flatId!==-1) return; e.preventDefault(); flatId=e.pointerId; try{ cv.setPointerCapture(e.pointerId); }catch(_){} const g=toG(e); gDown(g[0],g[1]); });
cv.addEventListener('pointermove',e=>{ if(e.pointerId!==flatId) return; const g=toG(e); gMove(g[0],g[1]); });
const flatUp=e=>{ if(e.pointerId===flatId){ flatId=-1; gUp(); } };
cv.addEventListener('pointerup',flatUp); cv.addEventListener('pointercancel',flatUp); cv.addEventListener('lostpointercapture',flatUp);
cv.addEventListener('contextmenu',e=>e.preventDefault());

function dockVar(){ document.documentElement.style.setProperty('--dockh',(innerHeight-dock.getBoundingClientRect().top+16)+'px'); }
addEventListener('resize',dockVar);
if(typeof ResizeObserver!=='undefined') new ResizeObserver(dockVar).observe(dock);

/* ---------- boot ---------- */
load();
select(tool,true);
setZoom(zoomT,true);
demo();
showDemoHint();
dockVar();
if(!window.WebGLRenderingContext) GF.use2d();
setTimeout(()=>{ if(GF.mode==='pending') GF.use2d(); },15000);
let last=performance.now(), acc=0;
function loop(now){
  let dt=now-last; last=now; if(dt>100) dt=100; if(dt<0) dt=0;
  if(!paused){ acc+=dt; let n=0; while(acc>=16.67&&n<3){ held(); step(); acc-=16.67; n++; } if(acc>50) acc=0; } else held();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

  await Promise.race([document.fonts.load('40px Silkscreen'), new Promise(r => setTimeout(r, 1500))]).catch(() => {});

  const spill = new THREE.Color(.45, .55, .9);

  const moon = new THREE.SpotLight('#c9d4ff', 2.3, 0, .3, .6, 0);

  const scrLight = new THREE.PointLight(spill, 9, 22, 2); scrLight.position.set(-.24, 7.4, -6.45); scene.add(scrLight);
  const pmrem = new THREE.PMREMGenerator(renderer);
  glass.material.envMap = pmrem.fromScene(new RoomEnvironment(), .04).texture; glass.material.envMapIntensity = .2;
  /* ---------- the moonbeam: thin additive slices through the window, striped by the slats ---------- */
  const MD = new THREE.Vector3(-18.8, -27.9, 22.9).normalize();
  {
    const pos = [], wv = [], al = [];

      fragmentShader: `uniform vec3 color; uniform float op; varying float vW; varying float vA; varying vec3 vP;
        void main(){ float f = fract(vW * 18.2); float stripe = smoothstep(0.0, 0.2, f) * smoothstep(0.75, 0.45, f);

  }
  /* ---------- live CRT texture: the game canvas upscaled with scanlines and a curved-glass vignette ---------- */
  const crt = document.createElement('canvas'); crt.width = 640; crt.height = 480;
  const cg = crt.getContext('2d');
  const over = document.createElement('canvas'); over.width = 640; over.height = 480;
  {
    const g = over.getContext('2d');

  screenMat.map = scrTex; screenMat.color.setScalar(1.5); screenMat.needsUpdate = true;

  {
    const P = [], S = [], Z = [], B = [];

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
    g.setAttribute('aSeed', new THREE.Float32BufferAttribute(S, 1));

  /* ---------- post: bloom, tilt-shift focused on the screen, vignette ---------- */

  function resize() {

  dragPlane.position.set(SC.x, SC.y, -5.85); dragPlane.updateMatrixWorld(); screenMesh.updateMatrixWorld();

    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {

        if (fAcc / fN > 24 && tier < 2) {
          tier++;
          if (tier === 1 && pr > 1) { pr = 1; resize(); }
          else { bloom.enabled = false; tsPasses[2].enabled = tsPasses[3].enabled = false; tsPasses[1].uniforms.vig.value = 1; }

} catch (err) {
  if (err && err.message !== 'skip') console.warn('3D room unavailable:', err);
  if (GF && GF.mode !== '3d') GF.use2d();
}
