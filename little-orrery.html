<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2d55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Little Orrery">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}</style>
<title>Little Orrery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: a full-screen clay solar system in WebGL, a glass dock floating at the bottom, in the same family as Grainfall. */
:root{
  --ink:#f6f3ff; --muted:#cfcbea; --glass:rgba(54,52,104,.52); --line:rgba(230,232,255,.24);
  --mint:#a6e3cc; --peach:#ffd3b0; --lilac:#c9c0ff; --moon:#cdd6ff;
  --f-head:"Fredoka","Avenir Next",system-ui,sans-serif;
  --f-body:"Nunito","Avenir Next",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse 90% 70% at 50% 40%, #4a4a86, #262649 75%) #262649;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:var(--f-body)}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.loading{position:fixed;inset:0;display:grid;place-items:center;padding-bottom:var(--dockh,160px);font:500 22px/1.2 var(--f-head);color:var(--muted);letter-spacing:.02em;pointer-events:none;transition:opacity .8s ease}
.loading.done{opacity:0}
.flat{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:500 18px/1.4 var(--f-body);color:var(--muted)}

/* planet names float over the scene */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:3px 9px;border-radius:999px;background:rgba(40,36,90,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:600 12px/1 var(--f-head);letter-spacing:.03em;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .25s}
.lab.on{opacity:1}
.lab.small{font-size:10px;padding:2px 6px;background:rgba(40,36,90,.45)}

.badge{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;pointer-events:none;text-shadow:0 1px 10px rgba(40,34,90,.55)}
.badge h1{margin:0;font:600 18px/1 var(--f-head);letter-spacing:.02em}
.badge span{font:500 14px/1 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.home{pointer-events:auto;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);color:var(--ink);text-decoration:none}
.home:hover{border-color:rgba(230,232,255,.48)}
.home:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.home svg{width:20px;height:20px;fill:currentColor}

.dock{position:fixed;left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:860px;margin-inline:auto;display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);box-shadow:0 18px 40px rgba(28,22,70,.35)}
.card{display:flex;align-items:center;gap:12px;min-height:44px}
.card .dot{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:inset -6px -6px 10px rgba(40,30,80,.25), inset 4px 4px 8px rgba(255,255,255,.45), 0 0 14px var(--c)}
.card .txt{flex:1;min-width:0}
.card h2{margin:0 0 2px;font:600 17px/1.1 var(--f-head)}
.card p{margin:0;font:500 13px/1.3 var(--f-body);color:var(--muted)}
.card p b{color:var(--ink);font-weight:700}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.lbl{font:600 11px/1 var(--f-head);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
#speed{width:120px;accent-color:var(--peach)}
.val{font:600 13px/1 var(--f-body);min-width:5.5ch;font-variant-numeric:tabular-nums;color:var(--ink)}
.btn{font:600 12px/1 var(--f-head);letter-spacing:.03em;padding:9px 12px;min-height:36px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.08);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:rgba(230,232,255,.48)}
.btn[aria-pressed="true"]{background:var(--mint);color:#1f3b33;border-color:var(--mint)}
.btn:focus-visible,#speed:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.spacer{flex:1}
@media (pointer:coarse){.btn{min-height:42px}}
@media (max-width:560px){.dock{padding:8px 10px;gap:6px}.card p{font-size:12px}#speed{width:96px}}
</style>
</head>
<body>

<canvas id="gl" aria-label="A clay model of the solar system. Drag to orbit, pinch to zoom, tap a planet to follow it."></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="loading" id="loading">Setting up the planets…</div>

<header class="badge">
  <a class="home" href="./" aria-label="Back to Stim Lab" title="Stim Lab">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
  </a>
  <h1>Little Orrery</h1><span id="clock">Year 0</span>
</header>

<section class="dock" id="dock" aria-label="Controls">
  <div class="card" id="card">
    <div class="dot" id="cardDot" style="--c:#ffd3b0;background:#ffe7c4"></div>
    <div class="txt"><h2 id="cardName">The Sun</h2><p id="cardText">Drag to spin the model, pinch to zoom, and tap a planet to follow it.</p></div>
  </div>
  <div class="row">
    <label for="speed" class="lbl">Speed</label>
    <input type="range" id="speed" min="0" max="100" value="45">
    <span id="speedVal" class="val">1 yr = 12s</span>
    <span class="spacer"></span>
    <button id="pause" class="btn" type="button" aria-pressed="false">Pause</button>
    <button id="labelsBtn" class="btn" type="button" aria-pressed="true">Names</button>
    <button id="orbitsBtn" class="btn" type="button" aria-pressed="true">Orbits</button>
    <button id="scaleBtn" class="btn" type="button" aria-pressed="false">To scale</button>
    <button id="reset" class="btn" type="button">Reset view</button>
  </div>
</section>

<script>
/* ---------- the model's facts and the dock, with no 3D needed ---------- */
window.LO = (() => {
  const $ = id => document.getElementById(id);
  // kind: planet, dwarf or craft. radius: Earth = 1; au: semi-major axis, Earth = 1; year: orbit time in Earth years; day: spin in Earth days (negative = backwards)
  // e, inc, node, peri: the real orbit shape (eccentricity, inclination, ascending node and longitude of perihelion, degrees). Used only at true scale.
  const BODIES = [
    { key: 'sun',     kind: 'sun',    name: 'The Sun', color: '#ffe7c4', glow: '#ffd3b0', radius: 109, au: 0,     year: 0,     day: 25,    tilt: 7,    fact: 'A warm clay lamp in the middle. Everything else circles it.' },
    { key: 'mercury', kind: 'planet', name: 'Mercury', color: '#cfc6d8', glow: '#d9d2e6', radius: .38, au: .387,  year: .24,   day: 58.6,  tilt: 0,    e: .2056, inc: 7.0, node: 48.3, peri: 77.5,  fact: 'The smallest and the quickest, round the Sun in 88 days on a clearly lopsided orbit.' },
    { key: 'venus',   kind: 'planet', name: 'Venus',   color: '#ffd4a8', glow: '#ffc9a1', radius: .95, au: .723,  year: .62,   day: -243,  tilt: 177,  e: .0068, inc: 3.4, node: 76.7, peri: 131.6, fact: 'Spins backwards, so slowly that its day is longer than its year.' },
    { key: 'earth',   kind: 'planet', name: 'Earth',   color: '#9fd3ff', glow: '#a6e3cc', radius: 1,   au: 1,     year: 1,     day: 1,     tilt: 23.4, e: .0167, inc: 0,   node: 0,    peri: 102.9, fact: 'Home. One little moon keeps it company, and Hubble and Webb keep watch.' },
    { key: 'mars',    kind: 'planet', name: 'Mars',    color: '#ffb09a', glow: '#ffa58f', radius: .53, au: 1.524, year: 1.88,  day: 1.03,  tilt: 25,   e: .0934, inc: 1.9, node: 49.6, peri: 336.0, fact: 'Rusty, about half the size of Earth, with two potato moons and a whole fleet of rovers parked on it.' },
    { key: 'jupiter', kind: 'planet', name: 'Jupiter', color: '#ffdcb8', glow: '#ffd0a6', radius: 11.2, au: 5.203, year: 11.86, day: .41,  tilt: 3,    e: .0484, inc: 1.3, node: 100.5, peri: 14.8, fact: 'The giant. Eleven Earths wide, and it spins once every ten hours.' },
    { key: 'saturn',  kind: 'planet', name: 'Saturn',  color: '#fff0c2', glow: '#ffe9b0', radius: 9.45, au: 9.537, year: 29.46, day: .45, tilt: 26.7, e: .0539, inc: 2.5, node: 113.7, peri: 92.4, fact: 'Wears a clay ring. Light enough to float, if you had a big enough bath.' },
    { key: 'uranus',  kind: 'planet', name: 'Uranus',  color: '#bdf0e4', glow: '#a6e3cc', radius: 4,   au: 19.19, year: 84,    day: -.72,  tilt: 98,   e: .0473, inc: .8,  node: 74.0, peri: 170.9, fact: 'Tipped on its side, so it rolls around the Sun.' },
    { key: 'neptune', kind: 'planet', name: 'Neptune', color: '#b3bcff', glow: '#a9b4ff', radius: 3.9, au: 30.07, year: 164.8, day: .67,   tilt: 28,   e: .0086, inc: 1.8, node: 131.8, peri: 45.0, fact: 'The last planet. One trip round the Sun takes 165 years.' },
    { key: 'ceres',    kind: 'dwarf', name: 'Ceres',    color: '#d9d2e6', glow: '#d9d2e6', radius: .074, au: 2.77, year: 4.6,  day: .38,  tilt: 4,   e: .079, inc: 10.6, node: 80.3, peri: 153.2, fact: 'The biggest rock in the asteroid belt, and the only dwarf planet on the near side of Jupiter.' },
    { key: 'pluto',    kind: 'dwarf', name: 'Pluto',    color: '#ffd9c9', glow: '#ffc9b4', radius: .186, au: 39.48, year: 248, day: -6.4, tilt: 120, e: .2488, inc: 17.2, node: 110.3, peri: 224.1, fact: 'The famous one. Its tilted, stretched orbit sometimes brings it inside Neptune\'s.' },
    { key: 'haumea',   kind: 'dwarf', name: 'Haumea',   color: '#f3f0ff', glow: '#e0dcff', radius: .13,  au: 43.1,  year: 283, day: .16,  tilt: 0,   e: .195, inc: 28.2, node: 122.2, peri: 240.4, fact: 'Spins so fast it has stretched into an egg.' },
    { key: 'makemake', kind: 'dwarf', name: 'Makemake', color: '#ffc8b0', glow: '#ffb59a', radius: .11,  au: 45.4,  year: 306, day: .95,  tilt: 0,   e: .161, inc: 29.0, node: 79.4, peri: 296.5, fact: 'A reddish ice world out in the Kuiper belt.' },
    { key: 'eris',     kind: 'dwarf', name: 'Eris',     color: '#eef2ff', glow: '#dbe3ff', radius: .18,  au: 67.8,  year: 559, day: 1.08, tilt: 0,   e: .44,  inc: 44.0, node: 35.9, peri: 187.1, fact: 'Nearly Pluto\'s twin, three times farther out, on an orbit tipped 44 degrees.' },
    // craft in flight: a direction (ecliptic longitude and latitude, degrees), a distance in AU, and how fast it is still heading out
    { key: 'voyager1',    kind: 'craft', name: 'Voyager 1',    color: '#f6f3ff', glow: '#c9c0ff', au: 165, lon: 258, lat: 35,  vel: 3.6, fact: 'Launched 1977, now the farthest human-made thing, 165 AU out and still calling home.' },
    { key: 'voyager2',    kind: 'craft', name: 'Voyager 2',    color: '#f6f3ff', glow: '#c9c0ff', au: 138, lon: 291, lat: -35, vel: 3.2, fact: 'Launched 1977, the only craft to visit Uranus and Neptune, now leaving the solar system southward.' },
    { key: 'newhorizons', kind: 'craft', name: 'New Horizons', color: '#f6f3ff', glow: '#c9c0ff', au: 61,  lon: 293, lat: -1,  vel: 2.9, fact: 'Flew past Pluto in 2015 and is now out in the Kuiper belt.' },
    // craft near Earth: a distance in Earth radii, a period in days (0 = it sits still beside Earth)
    { key: 'webb',   kind: 'sat', host: 'earth', name: 'Webb',   color: '#ffe3a8', glow: '#ffd37a', er: 235, period: 0,    fact: 'The James Webb Space Telescope sits at L2, 1.5 million km beyond Earth, always in the planet\'s shade.' },
    { key: 'hubble', kind: 'sat', host: 'earth', name: 'Hubble', color: '#f6f3ff', glow: '#c9c0ff', er: 1.085, period: .066, fact: 'The Hubble Space Telescope, 540 km up, round the Earth every 95 minutes since 1990.' },
    // moons: a distance in host radii, a size in host radii, a period in days
    { key: 'moon',   kind: 'moon', host: 'earth', name: 'The Moon', color: '#e6e2f2', glow: '#e6e2f2', hr: 60.3, size: .273, period: 27.3, fact: 'Our Moon, a quarter of Earth\'s width, 30 Earths away.' },
    { key: 'phobos', kind: 'moon', host: 'mars',  name: 'Phobos',   color: '#b8aed0', glow: '#b8aed0', hr: 2.76, size: .0066, period: .319, fact: 'A lumpy potato 22 km across, whizzing round Mars three times a day and slowly spiralling in.' },
    { key: 'deimos', kind: 'moon', host: 'mars',  name: 'Deimos',   color: '#c9c0d8', glow: '#c9c0d8', hr: 6.92, size: .0037, period: 1.263, fact: 'Mars\'s smaller, farther moon, 12 km across.' },
  ];
  // landers and rovers, pinned to the surface of the world they reached (latitude, east longitude, degrees)
  const LANDERS = [
    ['mars', 'Viking 1', 1976, 22.3, 312.0], ['mars', 'Viking 2', 1976, 48.0, 134.0], ['mars', 'Pathfinder', 1997, 19.1, 326.8], ['mars', 'Spirit', 2004, -14.6, 175.5],
    ['mars', 'Opportunity', 2004, -1.9, 354.5], ['mars', 'Phoenix', 2008, 68.2, 234.2], ['mars', 'Curiosity', 2012, -4.6, 137.4], ['mars', 'InSight', 2018, 4.5, 135.6],
    ['mars', 'Perseverance', 2021, 18.4, 77.5], ['mars', 'Zhurong', 2021, 25.1, 109.9],
    ['venus', 'Venera 7', 1970, -5.0, 351.0], ['venus', 'Venera 9', 1975, 31.0, 291.0], ['venus', 'Venera 13', 1982, -7.5, 303.0], ['venus', 'Vega 2', 1985, -7.1, 177.7],
    ['moon', 'Luna 9', 1966, 7.1, 295.6], ['moon', 'Apollo 11', 1969, .7, 23.5], ['moon', 'Lunokhod 1', 1970, 38.3, 325.0], ['moon', 'Apollo 17', 1972, 20.2, 30.8],
    ['moon', 'Chang\'e 4', 2019, -45.5, 177.6], ['moon', 'Chandrayaan-3', 2023, -69.4, 32.3],
    ['jupiter', 'Galileo probe', 1995, 6.5, 355.6],
  ];
  // two scales. Cute: planets shrink by square root and distances by a log, so the small ones stay visible and the big ones still look big.
  // True: planet sizes and orbit distances are in real proportion to each other (1 AU = 2.2 units), and orbits take their real shape.
  // Only the Sun is shrunk, since at true proportion to the planets it would swallow Mercury's orbit on any screen.
  const cuteD = au => au < 32 ? 4.3 + 2.55 * Math.log(1 + 4 * au) : 17.9 + (au - 32) * .045;
  for (const b of BODIES) {
    if (b.kind === 'sun') { b.r0 = 2.3; b.r1 = .5; b.d0 = b.d1 = 0; }
    else if (b.kind === 'planet' || b.kind === 'dwarf') { b.r0 = .17 + .3 * Math.sqrt(b.radius); b.r1 = .085 * b.radius; b.d0 = cuteD(b.au); b.d1 = b.au * 2.2; }
    else if (b.kind === 'craft') { b.r0 = .16; b.r1 = .1; b.d0 = 21.5 + (b.au - 61) * .012; b.d1 = b.au * 2.2; }
    b.r = b.r0 ?? 0; b.d = b.d0 ?? 0;
  }
  const speedIn = $('speed'), speedVal = $('speedVal'), pauseBtn = $('pause'), labelsBtn = $('labelsBtn'), orbitsBtn = $('orbitsBtn'), scaleBtn = $('scaleBtn'), resetBtn = $('reset');
  const cardDot = $('cardDot'), cardName = $('cardName'), cardText = $('cardText'), clockEl = $('clock');
  const LO = {
    BODIES, LANDERS, paused: false, labels: true, orbits: true, scale: false, yearSec: 12, follow: null, reset: 0,
    years: 0,
    showCard(b) {
      if (!b) { cardDot.style.setProperty('--c', '#ffd3b0'); cardDot.style.background = '#ffe7c4'; cardName.textContent = 'The Sun'; cardText.innerHTML = 'Drag to spin the model, pinch to zoom, and tap anything to follow it.'; return; }
      cardDot.style.setProperty('--c', b.glow); cardDot.style.background = b.color; cardName.textContent = b.name;
      let t = b.fact;
      if (b.kind === 'sun' && LO.scale) t += ' <b>Shown about 20× too small</b> next to the planets here; at their scale it would reach past Mercury.';
      else if (b.key === 'earth') t += ' The yardstick: <b>1 AU</b> from the Sun, <b>1 year</b> to go round.';
      else if (b.kind === 'planet' || b.kind === 'dwarf') {
        const yr = b.year < 1 ? Math.round(b.year * 365) + ' days' : (b.year % 1 ? b.year.toFixed(1) : b.year) + ' years';
        t += ' <b>' + (b.radius >= 1 ? b.radius + '× Earth\'s width' : Math.round(b.radius * 100) + '% of Earth\'s width') + '</b>, <b>' + b.au + ' AU</b> out, a year of <b>' + yr + '</b>.';
      }
      const pins = LANDERS.filter(l => l[0] === b.key);
      if (pins.length) t += ' <b>' + pins.length + ' landing' + (pins.length > 1 ? 's' : '') + '</b> pinned on the surface.';
      cardText.innerHTML = t;
    },
    tickClock() { const y = Math.floor(LO.years); clockEl.textContent = y === 1 ? 'Year 1' : 'Year ' + y; },
  };
  // the slider runs from 2 s per Earth year to 2 minutes, on a log scale
  function setSpeed(v, quiet) {
    LO.yearSec = 2 * Math.pow(60, v / 100);
    speedVal.textContent = '1 yr = ' + (LO.yearSec < 10 ? LO.yearSec.toFixed(1) : Math.round(LO.yearSec)) + 's';
    if (!quiet) save();
  }
  const KEY = 'little-orrery:prefs';
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ speed: +speedIn.value, labels: LO.labels, orbits: LO.orbits, scale: LO.scale })); } catch (_) {} }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (!s) return;
      if (typeof s.speed === 'number') speedIn.value = s.speed;
      if (typeof s.labels === 'boolean') LO.labels = s.labels;
      if (typeof s.orbits === 'boolean') LO.orbits = s.orbits;
      if (typeof s.scale === 'boolean') LO.scale = s.scale;
    } catch (_) {}
  }
  load();
  setSpeed(+speedIn.value, true);
  labelsBtn.setAttribute('aria-pressed', String(LO.labels)); orbitsBtn.setAttribute('aria-pressed', String(LO.orbits)); scaleBtn.setAttribute('aria-pressed', String(LO.scale));
  speedIn.addEventListener('input', () => setSpeed(+speedIn.value));
  pauseBtn.addEventListener('click', () => { LO.paused = !LO.paused; pauseBtn.textContent = LO.paused ? 'Play' : 'Pause'; pauseBtn.setAttribute('aria-pressed', String(LO.paused)); });
  labelsBtn.addEventListener('click', () => { LO.labels = !LO.labels; labelsBtn.setAttribute('aria-pressed', String(LO.labels)); save(); });
  orbitsBtn.addEventListener('click', () => { LO.orbits = !LO.orbits; orbitsBtn.setAttribute('aria-pressed', String(LO.orbits)); save(); });
  scaleBtn.addEventListener('click', () => {
    LO.scale = !LO.scale; scaleBtn.setAttribute('aria-pressed', String(LO.scale)); save();
    if (!LO.follow) { cardName.textContent = LO.scale ? 'To scale' : 'Cute scale'; cardText.innerHTML = LO.scale ? 'Real proportions and real orbit shapes: Jupiter is 11 Earths wide, Neptune is 77 times farther out than Mercury, and Pluto\'s stretched, tilted loop dips inside Neptune\'s. Zoom in to find the small ones. Only the Sun is shrunk.' : 'Sizes and distances squeezed so everything stays in view, on tidy round orbits.'; }
    else LO.showCard(LO.follow);
  });
  resetBtn.addEventListener('click', () => { LO.follow = null; LO.reset++; LO.showCard(null); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); pauseBtn.click(); } });
  const dock = $('dock');
  function dockVar() { document.documentElement.style.setProperty('--dockh', (innerHeight - dock.getBoundingClientRect().top + 16) + 'px'); }
  addEventListener('resize', dockVar); if (typeof ResizeObserver !== 'undefined') new ResizeObserver(dockVar).observe(dock);
  dockVar();
  LO.availH = () => Math.max(200, dock.getBoundingClientRect().top - 8);
  LO.ready = false;
  LO.fail = () => {
    if (LO.ready || LO.failed) return; LO.failed = true;
    $('gl').hidden = true; $('loading').hidden = true;
    const f = document.createElement('div'); f.className = 'flat'; f.textContent = 'The 3D model could not start here. It needs WebGL and a connection the first time, to fetch the 3D library.';
    document.body.append(f);
  };
  if (!window.WebGLRenderingContext) LO.fail();
  setTimeout(() => { if (!LO.ready) LO.fail(); }, 20000);
  return LO;
})();
</script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" onerror="window.LO&&LO.fail()">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

      uniforms: { color: { value: new THREE.Color('#fff2dc') } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      vertexShader: 'attribute float al; varying float vA; void main(){ vA=al; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader: 'uniform vec3 color; varying float vA; void main(){ gl_FragColor=vec4(color*vA*vA*1.6,1.0); }',
    });
    const head = new THREE.SpriteMaterial({ map: softTex, color: '#fff6e8', transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    for (let i = 0; i < 7; i++) {
      const m = new THREE.Mesh(geo, mat), h = new THREE.Sprite(head); h.scale.setScalar(1.2); m.add(h);
      m.visible = false; scene.add(m); meteors.push({ m, t: 0, life: 0, wait: 1 + rand() * 6, vel: new THREE.Vector3(), len: 1 });
    }
  }
  function spawnMeteor(mt, dist) {
    const r = dist * (.9 + rand() * .9), th = rand() * 6.283, ph = Math.acos(rand() * 1.4 - .4);
    mt.m.position.set(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th));
    mt.vel.set(rand() - .5, -(.2 + rand() * .6), rand() - .5).normalize().multiplyScalar(dist * (.25 + rand() * .35));
    mt.len = dist * (.08 + rand() * .1); mt.life = 1.2 + rand() * 1.4; mt.t = 0; mt.m.visible = true;
    mt.m.lookAt(mt.m.position.clone().add(mt.vel)); mt.m.scale.set(1, 1, mt.len);
  }
  function pebbleBelt(n, color, period, szMin, szMax, thick) {
    const m = new THREE.InstancedMesh(rockGeo, clay(color, { rough: .95, bump: .6 }), n);
    const M = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), s = new THREE.Vector3();
    const rocks = []; for (let i = 0; i < n; i++) rocks.push({ a: rand() * 6.283, f: rand(), y: (rand() - .5) * thick, sz: szMin + rand() * (szMax - szMin), spin: rand() * 6.3, sp: (rand() - .5) * 2 });
    m.update = (yrs, dIn, dOut, shrink) => {
      for (let i = 0; i < n; i++) {
        const k = rocks[i], d = lerp(dIn, dOut, k.f), ang = k.a + yrs * 6.283 / (period * (0.8 + k.f * .5));
        v.set(Math.cos(ang) * d, k.y * d, Math.sin(ang) * d); e.set(k.spin + yrs * k.sp, k.spin * 2, 0); q.setFromEuler(e);
        const sz = k.sz * shrink; s.set(sz, sz * .8, sz * 1.2);
        M.compose(v, q, s); m.setMatrixAt(i, M);
      }
      m.instanceMatrix.needsUpdate = true;
    };
    scene.add(m); return m;
  }
  const belt = pebbleBelt(140, '#a79dc4', 4.6, .03, .08, .12);      // the real belt sits between 2.2 and 3.3 AU
  const kuiper = pebbleBelt(260, '#b9c4e8', 250, .03, .09, .16);     // the Kuiper belt, 30 to 50 AU, Pluto's neighbourhood
  const dOf = au => lerp(au < 32 ? 4.3 + 2.55 * Math.log(1 + 4 * au) : 17.9 + (au - 32) * .045, au * 2.2, scaleK);

  /* ---------- camera: orbit with one finger, zoom with two, follow anything when tapped ---------- */
  const cam = new THREE.PerspectiveCamera(36, 1, .05, 5000);
  const view = { yaw: .7, pitch: .5, dist: 80, tYaw: .7, tPitch: .5, tDist: 80, auto: true };
  const HOME = { yaw: .7, pitch: .5 };
  let vw = 1, vh = 1, avail = 1;
  const target = new THREE.Vector3(), tgtGoal = new THREE.Vector3(), tmp = new THREE.Vector3();
  let lastReset = LO.reset, followE = 0;
  function homeDist() { return .98 * outer / (Math.tan(18 * Math.PI / 180) * Math.min(avail, vw) / vh); }
  function placeCamera(now, dtc) {
    if (LO.reset !== lastReset) { lastReset = LO.reset; view.tYaw = HOME.yaw; view.tPitch = HOME.pitch; view.tDist = homeDist(); view.auto = true; }
    const k = reduce ? 1 : 1 - Math.exp(-dtc / .28);
    if (view.auto && !reduce) view.tYaw += dtc * .05;
    view.yaw += (view.tYaw - view.yaw) * k; view.pitch += (view.tPitch - view.pitch) * k; view.dist += (view.tDist - view.dist) * k;
    const f = LO.follow ? byKey[LO.follow.key] : null;
    followE += ((f ? 1 : 0) - followE) * k;
    if (f) { f.mesh.getWorldPosition(tgtGoal); } else tgtGoal.set(0, 0, 0);
    target.lerp(tgtGoal, f ? Math.min(1, k * 1.5) : k);
    const d = f ? lerp(view.dist, f.b.r * 7 + (f.b.kind === 'planet' || f.b.kind === 'sun' ? 1.2 : .25), followE) : view.dist;
    cam.position.set(target.x + d * Math.cos(view.pitch) * Math.sin(view.yaw), target.y + d * Math.sin(view.pitch), target.z + d * Math.cos(view.pitch) * Math.cos(view.yaw));
    cam.lookAt(target); cam.updateMatrixWorld();
  }

  /* ---------- post: a gentle bloom, a tilt-shift blur focused on the model, and a vignette ---------- */
  let pr = Math.min(window.devicePixelRatio || 1, 1.5);
  const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 }));
  composer.addPass(new RenderPass(scene, cam));
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), .45, .7, .8);
  composer.addPass(bloom);
  const TS = {
    uniforms: { tDiffuse: { value: null }, dir: { value: new THREE.Vector2(1, 0) }, res: { value: new THREE.Vector2(1, 1) }, focus: { value: .5 }, band: { value: .22 }, fade: { value: .3 }, amt: { value: 2 }, vig: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 dir, res; uniform float focus, band, fade, amt, vig; varying vec2 vUv;
    void main(){
      float a = smoothstep(band, band + fade, abs(vUv.y - focus)) * amt;
      vec2 st = dir / res * a;
      vec4 c = texture2D(tDiffuse, vUv) * 0.2270270270;
      c += texture2D(tDiffuse, vUv + st * 1.3846153846) * 0.3162162162; c += texture2D(tDiffuse, vUv - st * 1.3846153846) * 0.3162162162;
      c += texture2D(tDiffuse, vUv + st * 3.2307692308) * 0.0702702703; c += texture2D(tDiffuse, vUv - st * 3.2307692308) * 0.0702702703;
      if (vig > 0.5) c.rgb *= mix(1.0, 0.7, smoothstep(0.45, 1.0, length((vUv - 0.5) * vec2(1.1, 1.0))));
      gl_FragColor = c;
    }`,
  };
  const tsPasses = [[1, 0, 0], [0, 1, 0], [1, 0, 0], [0, 1, 1]].map(([dx, dy, vg]) => { const p = new ShaderPass(TS); p.uniforms.dir.value.set(dx, dy); p.uniforms.vig.value = vg; composer.addPass(p); return p; });
  composer.addPass(new OutputPass());

  function resize() {
    vw = innerWidth; vh = innerHeight; avail = Math.min(vh, LO.availH());
    const fullH = 2 * vh - avail, oy = vh - avail;
    cam.aspect = vw / fullH; cam.fov = 2 * Math.atan(Math.tan(18 * Math.PI / 180) * fullH / vh) * 180 / Math.PI;
    cam.setViewOffset(vw, fullH, 0, oy, vw, vh); cam.updateProjectionMatrix();
    if (view.auto && !LO.follow) view.tDist = homeDist();
    renderer.setPixelRatio(pr); renderer.setSize(vw, vh, false);
    composer.setPixelRatio(pr); composer.setSize(vw, vh);
    for (const p of tsPasses) p.uniforms.res.value.set(vw * pr, vh * pr);
    for (const m of starLayers) m.uniforms.uScale.value = vh * pr / 2;
  }
  resize();
  addEventListener('resize', resize);
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(document.getElementById('dock'));

  /* ---------- touch ---------- */
  const canvas = renderer.domElement, ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const ptrs = new Map(); let moved = 0, pinch0 = 0, dist0 = 0, downT = 0;
  const pxOf = (worldLen, camD) => worldLen / camD * (vh / 2) / Math.tan(cam.fov * Math.PI / 360);
  const pick = e => {
    ndc.set(e.clientX / vw * 2 - 1, -(e.clientY / vh) * 2 + 1); ray.setFromCamera(ndc, cam);
    // a generous hit area: the nearest body whose screen-space distance is within a thumb; tiny things need to be at least a dot on screen
    let best = null, bd = 1e9;
    for (const x of [byKey.sun, ...bodies]) {
      x.mesh.getWorldPosition(tmp); const dist = ray.ray.distanceToPoint(tmp); const camD = tmp.distanceTo(cam.position);
      const px = pxOf(dist, camD), rpx = pxOf(x.b.r, camD);
      if (rpx < .6 && x.b.kind !== 'planet') continue;
      if (px < Math.max(rpx + 6, 24) && camD < bd) { best = x; bd = camD; }
    }
    return best;
  };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; downT = performance.now();
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = view.tDist; }
  });
  canvas.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if (!p) { if (e.pointerType === 'mouse') canvas.style.cursor = pick(e) ? 'pointer' : 'grab'; return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy);
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) { view.tYaw -= dx * .006; view.tPitch = clamp(view.tPitch + dy * .005, -.3, 1.45); view.auto = false; }
    else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0 > 0) view.tDist = clamp(dist0 * pinch0 / d, .3, 1200); }
  });
  const endPtr = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0 && moved < 8 && performance.now() - downT < 400) {
      const hit = pick(e);
      if (hit && hit.b !== S) { LO.follow = hit.b; LO.showCard(hit.b); }
      else if (hit) { LO.follow = null; LO.showCard(S); }
      else if (LO.follow) { LO.follow = null; LO.showCard(null); }
    }
    if (ptrs.size === 1) pinch0 = 0;
  };
  canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr); canvas.addEventListener('lostpointercapture', endPtr);
  canvas.addEventListener('wheel', e => { e.preventDefault(); view.tDist = clamp(view.tDist * (1 + e.deltaY * .0015), .3, 1200); }, { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  /* ---------- labels: names projected to the screen; small things only get one when they are big enough to see ---------- */
  const labelsEl = document.getElementById('labels');
  const mkLab = (text, small) => { const d = document.createElement('div'); d.className = 'lab' + (small ? ' small' : ''); d.textContent = text; labelsEl.append(d); return d; };
  const labs = [byKey.sun, ...bodies].map(x => ({ x, d: mkLab(x.b.name, x.b.kind !== 'planet' && x.b.kind !== 'sun') }));
  for (const x of bodies) for (const pin of x.pins) labs.push({ x, pin, d: mkLab(pin.name, true) });
  function placeLabels() {
    for (const { x, pin, d } of labs) {
      if (!LO.labels) { d.classList.remove('on'); continue; }
      let on;
      if (pin) { pin.p.getWorldPosition(tmp); on = LO.follow === x.b && tmp.distanceTo(cam.position) < x.b.r * 2.6 + .5; if (on) { tmp.project(cam); on = tmp.z < 1; } }
      else {
        x.mesh.getWorldPosition(tmp); const camD = tmp.distanceTo(cam.position), rpx = pxOf(x.b.r, camD);
        on = (x.b.kind === 'planet' || x.b.kind === 'sun' || x.b.kind === 'dwarf' || x.b.kind === 'craft' || rpx > 2.5 || LO.follow === x.b || (x.host && LO.follow === x.host.b));
        if (on && (x.b.kind === 'moon' || x.b.kind === 'sat') && rpx < 7 && LO.follow !== x.b && LO.follow !== x.host.b) on = false;
        if (on && x.b.kind !== 'planet' && x.b.kind !== 'sun' && rpx < .4 && LO.follow !== x.b) on = false;
        tmp.y += x.b.r * 1.25 + (x.b.kind === 'planet' || x.b.kind === 'sun' ? .3 : .02); tmp.project(cam);
        on = on && tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05;
      }
      d.classList.toggle('on', on);
      if (on) d.style.transform = 'translate(' + ((tmp.x + 1) / 2 * vw).toFixed(1) + 'px,' + ((1 - tmp.y) / 2 * vh).toFixed(1) + 'px) translate(-50%,-100%)';
    }
  }

  /* ---------- frame loop, with a step down in quality if the device struggles ---------- */
  let first = true, lastT = performance.now(), fc = 0, fAcc = 0, fN = 0, tier = 0, clockAcc = 0;
  const fpsEl = /[?&]fps\b/.test(location.search) ? document.getElementById('clock') : null;
  const hostPos = new THREE.Vector3(), away = new THREE.Vector3();
  function placeBodies() {
    const yrs = LO.years;
    for (const x of bodies) {
      const b = x.b;
      if (b.kind === 'planet' || b.kind === 'dwarf') orbitPos(b, b.d, x.M0 + yrs * Math.PI * 2 / b.year, scaleK, x.node.position);
      else if (b.kind === 'craft') {
        const lon = b.lon * RAD, lat = b.lat * RAD, d = b.d + (b.vel * yrs * 2.2) * scaleK;
        x.node.position.set(Math.cos(lat) * Math.cos(lon), Math.sin(lat), -Math.cos(lat) * Math.sin(lon)).multiplyScalar(d);
      } else if (b.kind === 'moon' || (b.kind === 'sat' && b.period)) {
        x.host.mesh.getWorldPosition(hostPos);
        const a = x.M0 + yrs * 365.25 / b.period * Math.PI * 2, inc = (b.key === 'moon' ? 5.1 : b.key === 'hubble' ? 28.5 : 1) * RAD;
        x.node.position.set(hostPos.x + Math.cos(a) * b.d, hostPos.y + Math.sin(a) * Math.sin(inc) * b.d, hostPos.z - Math.sin(a) * Math.cos(inc) * b.d);
      } else if (b.kind === 'sat') { // Webb sits beyond Earth, straight away from the Sun
        x.host.mesh.getWorldPosition(hostPos); away.copy(hostPos).normalize();
        x.node.position.copy(hostPos).addScaledVector(away, b.d);
      }
    }
  }
  function frame(now) {
    const dt = Math.min(.1, Math.max(0, (now - lastT) / 1000)); lastT = now; fc++;
    const want = LO.scale ? 1 : 0;
    if (scaleE !== want) {
      scaleE = reduce ? want : clamp(scaleE + (want - scaleE > 0 ? 1 : -1) * dt / 1.4, 0, 1);
      layout(scaleE);
      if (!LO.follow) { view.tDist = homeDist(); view.auto = true; }
    }
    if (!LO.paused) {
      const dy = dt / LO.yearSec;
      LO.years += dy;
      for (const x of bodies) { if (x.b.day) x.mesh.rotation.y += dy * 365.25 / x.b.day * Math.PI * 2 * .02; if (x.b.kind === 'craft') x.mesh.rotation.y += dt * .2; }
      sun.rotation.y += dy * 365.25 / S.day * Math.PI * 2 * .02;
      belt.update(LO.years, dOf(2.2), dOf(3.3), lerp(1, .5, scaleK));
      kuiper.update(LO.years, dOf(31), dOf(50), lerp(1, .9, scaleK));
      clockAcc += dt; if (clockAcc > .25) { clockAcc = 0; if (!fpsEl) LO.tickClock(); }
    }
    placeBodies();
    for (const x of bodies) if (x.hoop) x.hoop.visible = LO.orbits;
    placeCamera(now, dt);
    if (!reduce) {
      for (const m of starLayers) m.uniforms.uTime.value = now / 1000;
      for (const mt of meteors) {
        if (!mt.m.visible) { mt.wait -= dt; if (mt.wait <= 0 && !LO.paused) spawnMeteor(mt, Math.max(40, outer * 1.6)); continue; }
        mt.t += dt; mt.m.position.addScaledVector(mt.vel, dt);
        const f = Math.sin(Math.PI * clamp(mt.t / mt.life, 0, 1)); mt.m.scale.set(f, f, mt.len * f + .01);
        if (mt.t >= mt.life) { mt.m.visible = false; mt.wait = 2 + rand() * 9; }
      }
    }
    halo.material.opacity = .5 + .1 * Math.sin(now / 900);
    tmp.copy(target).project(cam);
    const fy = clamp((tmp.y + 1) / 2, .1, .9);
    for (const p of tsPasses) { p.uniforms.focus.value = fy; p.uniforms.band.value = .2 + .25 * followE; p.uniforms.amt.value = 2.2 * pr; }
    composer.render();
    placeLabels();
    if (first) { first = false; LO.ready = true; document.getElementById('loading').classList.add('done'); }
    if (fc > 40 && dt < .2) {
      fAcc += dt * 1000; fN++;
      if (fN === 90) {
        const ms = fAcc / fN;
        if (fpsEl) fpsEl.textContent = Math.round(1000 / ms) + ' fps · tier ' + tier;
        if (ms > 24 && tier < 3) {
          tier++;
          if (tier === 1 && pr > 1) { pr = 1; resize(); }
          else if (tier <= 2) { tier = 2; bloom.enabled = false; tsPasses[2].enabled = tsPasses[3].enabled = false; tsPasses[1].uniforms.vig.value = 1; }
          else { pr = Math.min(pr, .75); resize(); }
        }
        fAcc = 0; fN = 0;
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
} catch (err) {
  if (err && err.message !== 'skip') console.warn('3D model unavailable:', err);
  if (LO) LO.fail();
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
