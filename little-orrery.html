<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b2d55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Little Orrery">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}</style>
<title>Little Orrery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: a full-screen clay solar system in WebGL, a glass dock floating at the bottom, in the same family as Grainfall. */
:root{
  --ink:#f6f3ff; --muted:#cfcbea; --glass:rgba(54,52,104,.52); --line:rgba(230,232,255,.24);
  --mint:#a6e3cc; --peach:#ffd3b0; --lilac:#c9c0ff; --moon:#cdd6ff;
  --f-head:"Fredoka","Avenir Next",system-ui,sans-serif;
  --f-body:"Nunito","Avenir Next",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse 90% 70% at 50% 40%, #4a4a86, #262649 75%) #262649;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;font-family:var(--f-body)}

#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.loading{position:fixed;inset:0;display:grid;place-items:center;padding-bottom:var(--dockh,160px);font:500 22px/1.2 var(--f-head);color:var(--muted);letter-spacing:.02em;pointer-events:none;transition:opacity .8s ease}
.loading.done{opacity:0}
.flat{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:500 18px/1.4 var(--f-body);color:var(--muted)}

/* planet names float over the scene */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-100%);padding:3px 9px;border-radius:999px;background:rgba(40,36,90,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:600 12px/1 var(--f-head);letter-spacing:.03em;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .25s}
.lab.on{opacity:1}

.badge{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;pointer-events:none;text-shadow:0 1px 10px rgba(40,34,90,.55)}
.badge h1{margin:0;font:600 18px/1 var(--f-head);letter-spacing:.02em}
.badge span{font:500 14px/1 var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.home{pointer-events:auto;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);color:var(--ink);text-decoration:none}
.home:hover{border-color:rgba(230,232,255,.48)}
.home:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.home svg{width:20px;height:20px;fill:currentColor}

.dock{position:fixed;left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:860px;margin-inline:auto;display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);box-shadow:0 18px 40px rgba(28,22,70,.35)}
.card{display:flex;align-items:center;gap:12px;min-height:44px}
.card .dot{flex:none;width:30px;height:30px;border-radius:50%;box-shadow:inset -6px -6px 10px rgba(40,30,80,.25), inset 4px 4px 8px rgba(255,255,255,.45), 0 0 14px var(--c)}
.card .txt{flex:1;min-width:0}
.card h2{margin:0 0 2px;font:600 17px/1.1 var(--f-head)}
.card p{margin:0;font:500 13px/1.3 var(--f-body);color:var(--muted)}
.card p b{color:var(--ink);font-weight:700}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.lbl{font:600 11px/1 var(--f-head);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
#speed{width:120px;accent-color:var(--peach)}
.val{font:600 13px/1 var(--f-body);min-width:5.5ch;font-variant-numeric:tabular-nums;color:var(--ink)}
.btn{font:600 12px/1 var(--f-head);letter-spacing:.03em;padding:9px 12px;min-height:36px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.08);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:rgba(230,232,255,.48)}
.btn[aria-pressed="true"]{background:var(--mint);color:#1f3b33;border-color:var(--mint)}
.btn:focus-visible,#speed:focus-visible{outline:2px solid var(--moon);outline-offset:2px}
.spacer{flex:1}
@media (pointer:coarse){.btn{min-height:42px}}
@media (max-width:560px){.dock{padding:8px 10px;gap:6px}.card p{font-size:12px}#speed{width:96px}}
</style>
</head>
<body>

<canvas id="gl" aria-label="A clay model of the solar system. Drag to orbit, pinch to zoom, tap a planet to follow it."></canvas>
<div id="labels" aria-hidden="true"></div>
<div class="loading" id="loading">Setting up the planets…</div>

<header class="badge">
  <a class="home" href="./" aria-label="Back to Stim Lab" title="Stim Lab">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
  </a>
  <h1>Little Orrery</h1><span id="clock">Year 0</span>
</header>

<section class="dock" id="dock" aria-label="Controls">
  <div class="card" id="card">
    <div class="dot" id="cardDot" style="--c:#ffd3b0;background:#ffe7c4"></div>
    <div class="txt"><h2 id="cardName">The Sun</h2><p id="cardText">Drag to spin the model, pinch to zoom, and tap a planet to follow it.</p></div>
  </div>
  <div class="row">
    <label for="speed" class="lbl">Speed</label>
    <input type="range" id="speed" min="0" max="100" value="45">
    <span id="speedVal" class="val">1 yr = 12s</span>
    <span class="spacer"></span>
    <button id="pause" class="btn" type="button" aria-pressed="false">Pause</button>
    <button id="labelsBtn" class="btn" type="button" aria-pressed="true">Names</button>
    <button id="orbitsBtn" class="btn" type="button" aria-pressed="true">Orbits</button>
    <button id="reset" class="btn" type="button">Reset view</button>
  </div>
</section>

<script>
/* ---------- the model's facts and the dock, with no 3D needed ---------- */
window.LO = (() => {
  const $ = id => document.getElementById(id);
  // radius: Earth = 1; au: distance from the Sun, Earth = 1; year: orbit time in Earth years; day: spin in Earth days (negative = backwards)
  const BODIES = [
    { key: 'sun',     name: 'The Sun', color: '#ffe7c4', glow: '#ffd3b0', radius: 109, au: 0,     year: 0,     day: 25,    tilt: 7,    fact: 'A warm clay lamp in the middle. Everything else circles it.' },
    { key: 'mercury', name: 'Mercury', color: '#cfc6d8', glow: '#d9d2e6', radius: .38, au: .39,   year: .24,   day: 58.6,  tilt: 0,    fact: 'The smallest and the quickest, round the Sun in 88 days.' },
    { key: 'venus',   name: 'Venus',   color: '#ffd4a8', glow: '#ffc9a1', radius: .95, au: .72,   year: .62,   day: -243,  tilt: 177,  fact: 'Spins backwards, so slowly that its day is longer than its year.' },
    { key: 'earth',   name: 'Earth',   color: '#9fd3ff', glow: '#a6e3cc', radius: 1,   au: 1,     year: 1,     day: 1,     tilt: 23.4, fact: 'Home. One little moon keeps it company.' },
    { key: 'mars',    name: 'Mars',    color: '#ffb09a', glow: '#ffa58f', radius: .53, au: 1.52,  year: 1.88,  day: 1.03,  tilt: 25,   fact: 'Rusty, about half the size of Earth, with a day almost the same length.' },
    { key: 'jupiter', name: 'Jupiter', color: '#ffdcb8', glow: '#ffd0a6', radius: 11.2, au: 5.2,  year: 11.86, day: .41,   tilt: 3,    fact: 'The giant. Eleven Earths wide, and it spins once every ten hours.' },
    { key: 'saturn',  name: 'Saturn',  color: '#fff0c2', glow: '#ffe9b0', radius: 9.45, au: 9.54, year: 29.46, day: .45,   tilt: 26.7, fact: 'Wears a clay ring. Light enough to float, if you had a big enough bath.' },
    { key: 'uranus',  name: 'Uranus',  color: '#bdf0e4', glow: '#a6e3cc', radius: 4,   au: 19.2,  year: 84,    day: -.72,  tilt: 98,   fact: 'Tipped on its side, so it rolls around the Sun.' },
    { key: 'neptune', name: 'Neptune', color: '#b3bcff', glow: '#a9b4ff', radius: 3.9, au: 30.1,  year: 164.8, day: .67,   tilt: 28,   fact: 'The far edge. One trip round the Sun takes 165 years.' },
  ];
  // model scale: planets shrink by square root and distances by a log, so the small ones stay visible and the big ones still look big
  for (const b of BODIES) {
    b.r = b.key === 'sun' ? 2.3 : .17 + .3 * Math.sqrt(b.radius);
    b.d = b.au ? 4.3 + 2.55 * Math.log(1 + 4 * b.au) : 0;
  }
  const speedIn = $('speed'), speedVal = $('speedVal'), pauseBtn = $('pause'), labelsBtn = $('labelsBtn'), orbitsBtn = $('orbitsBtn'), resetBtn = $('reset');
  const cardDot = $('cardDot'), cardName = $('cardName'), cardText = $('cardText'), clockEl = $('clock');
  const LO = {
    BODIES, paused: false, labels: true, orbits: true, yearSec: 12, follow: null, reset: 0,
    years: 0,
    showCard(b) {
      if (!b) { cardDot.style.setProperty('--c', '#ffd3b0'); cardDot.style.background = '#ffe7c4'; cardName.textContent = 'The Sun'; cardText.innerHTML = 'Drag to spin the model, pinch to zoom, and tap a planet to follow it.'; return; }
      cardDot.style.setProperty('--c', b.glow); cardDot.style.background = b.color; cardName.textContent = b.name;
      const yr = b.year < 1 ? Math.round(b.year * 365) + ' days' : (b.year % 1 ? b.year.toFixed(1) : b.year) + ' years';
      cardText.innerHTML = b.key === 'sun' ? b.fact : b.key === 'earth' ? b.fact + ' The yardstick: <b>1 AU</b> from the Sun, <b>1 year</b> to go round.' : b.fact + ' <b>' + (b.radius >= 1 ? b.radius + '× Earth\'s width' : Math.round(b.radius * 100) + '% of Earth\'s width') + '</b>, <b>' + b.au + ' AU</b> out, a year of <b>' + yr + '</b>.';
    },
    tickClock() { const y = Math.floor(LO.years); clockEl.textContent = y === 1 ? 'Year 1' : 'Year ' + y; },
  };
  // the slider runs from 2 s per Earth year to 2 minutes, on a log scale
  function setSpeed(v, quiet) {
    LO.yearSec = 2 * Math.pow(60, v / 100);
    speedVal.textContent = '1 yr = ' + (LO.yearSec < 10 ? LO.yearSec.toFixed(1) : Math.round(LO.yearSec)) + 's';
    if (!quiet) save();
  }
  const KEY = 'little-orrery:prefs';
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ speed: +speedIn.value, labels: LO.labels, orbits: LO.orbits })); } catch (_) {} }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (!s) return;
      if (typeof s.speed === 'number') speedIn.value = s.speed;
      if (typeof s.labels === 'boolean') LO.labels = s.labels;
      if (typeof s.orbits === 'boolean') LO.orbits = s.orbits;
    } catch (_) {}
  }
  load();
  setSpeed(+speedIn.value, true);
  labelsBtn.setAttribute('aria-pressed', String(LO.labels)); orbitsBtn.setAttribute('aria-pressed', String(LO.orbits));
  speedIn.addEventListener('input', () => setSpeed(+speedIn.value));
  pauseBtn.addEventListener('click', () => { LO.paused = !LO.paused; pauseBtn.textContent = LO.paused ? 'Play' : 'Pause'; pauseBtn.setAttribute('aria-pressed', String(LO.paused)); });
  labelsBtn.addEventListener('click', () => { LO.labels = !LO.labels; labelsBtn.setAttribute('aria-pressed', String(LO.labels)); save(); });
  orbitsBtn.addEventListener('click', () => { LO.orbits = !LO.orbits; orbitsBtn.setAttribute('aria-pressed', String(LO.orbits)); save(); });
  resetBtn.addEventListener('click', () => { LO.follow = null; LO.reset++; LO.showCard(null); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); pauseBtn.click(); } });
  const dock = $('dock');
  function dockVar() { document.documentElement.style.setProperty('--dockh', (innerHeight - dock.getBoundingClientRect().top + 16) + 'px'); }
  addEventListener('resize', dockVar); if (typeof ResizeObserver !== 'undefined') new ResizeObserver(dockVar).observe(dock);
  dockVar();
  LO.availH = () => Math.max(200, dock.getBoundingClientRect().top - 8);
  LO.ready = false;
  LO.fail = () => {
    if (LO.ready || LO.failed) return; LO.failed = true;
    $('gl').hidden = true; $('loading').hidden = true;
    const f = document.createElement('div'); f.className = 'flat'; f.textContent = 'The 3D model could not start here. It needs WebGL and a connection the first time, to fetch the 3D library.';
    document.body.append(f);
  };
  if (!window.WebGLRenderingContext) LO.fail();
  setTimeout(() => { if (!LO.ready) LO.fail(); }, 20000);
  return LO;
})();
</script>

  rim.rotation.x = Math.PI / 2; rim.position.y = .0; scene.add(rim);
  const orbitMat = clay('#c9c0ff', { rep: 10, bump: .25 });
  const orbitRings = PLANETS.map(b => { const m = new THREE.Mesh(new THREE.TorusGeometry(b.d, .09, 8, 160), orbitMat); m.rotation.x = Math.PI / 2; m.position.y = .02; scene.add(m); return m; });

  const sphere = new THREE.SphereGeometry(1, 48, 32);
  const sun = new THREE.Mesh(sphere, clay('#ffe7c4', { map: TEX.sun, rough: .6, bump: .35, emissive: '#ffb57a', ei: .55 }));
  sun.scale.setScalar(S.r); sun.position.y = S.r * .6; scene.add(sun);
  sunLight.position.copy(sun.position);
  // a soft halo sprite behind the sun so the glow reads even where bloom is turned off
  const haloTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'); const r = g.createRadialGradient(64, 64, 10, 64, 64, 64); r.addColorStop(0, 'rgba(255,225,190,.9)'); r.addColorStop(.4, 'rgba(255,205,160,.35)'); r.addColorStop(1, 'rgba(255,200,160,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: .9 }));
  halo.scale.setScalar(S.r * 3.4); halo.position.copy(sun.position); scene.add(halo);

  const bodies = [];
  for (const b of PLANETS) {
    const pivot = new THREE.Group(); scene.add(pivot);
    const tiltG = new THREE.Group(); tiltG.rotation.z = b.tilt * Math.PI / 180; pivot.add(tiltG);
    const mesh = new THREE.Mesh(sphere, clay(b.color, { map: TEX[b.key], bump: .45, rep: 1 }));
    mesh.scale.setScalar(b.r); tiltG.add(mesh);
    tiltG.position.set(b.d, b.r + .55, 0);
    const extra = {};
    if (b.key === 'saturn') {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(b.r * 1.75, b.r * .28, 10, 72), clay('#ffe3a8', { rep: 4, bump: .4 }));
      ring.scale.y = .3; ring.rotation.x = Math.PI / 2; tiltG.add(ring);
      const ring2 = new THREE.Mesh(new THREE.TorusGeometry(b.r * 2.25, b.r * .14, 10, 80), clay('#fff0cc', { rep: 4, bump: .4 }));
      ring2.scale.y = .3; ring2.rotation.x = Math.PI / 2; tiltG.add(ring2);
    }
    if (b.key === 'uranus') {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(b.r * 1.9, b.r * .07, 8, 72), clay('#d8f7ef', { rep: 4, bump: .4 }));
      ring.rotation.x = Math.PI / 2; tiltG.add(ring);
    }
    if (b.key === 'earth') {
      const mp = new THREE.Group(); tiltG.add(mp);
      const moon = new THREE.Mesh(sphere, clay('#e6e2f2', { map: TEX.mercury, bump: .5 })); moon.scale.setScalar(b.r * .27); moon.position.x = b.r * 2.1; mp.add(moon);
      extra.moonPivot = mp;
    }
    pivot.rotation.y = rand() * Math.PI * 2;
    bodies.push({ b, pivot, tiltG, mesh, ...extra });
  }

  /* ---------- stars: tiny pastel points far out, and a few bigger blurry ones near the camera ---------- */
  {
    const n = 900, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), sz = new Float32Array(n);
    const pal = [[1, .93, .85], [.78, .9, 1], [.9, .82, 1], [.8, 1, .92]];
    for (let i = 0; i < n; i++) {
      const th = rand() * 6.283, ph = Math.acos(rand() * 1.6 - .6), r = 90 + rand() * 60;
      pos[i * 3] = r * Math.sin(ph) * Math.cos(th); pos[i * 3 + 1] = r * Math.cos(ph); pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
      const c = pal[(rand() * pal.length) | 0]; col.set(c, i * 3); sz[i] = .6 + rand() * 1.8;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('col', new THREE.BufferAttribute(col, 3)); g.setAttribute('sz', new THREE.BufferAttribute(sz, 1));
    const m = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uScale: { value: 300 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: 'attribute vec3 col; attribute float sz; uniform float uTime, uScale; varying vec3 vC; varying float vA; void main(){ vC=col; vec4 mv=modelViewMatrix*vec4(position,1.0); vA=0.55+0.45*sin(uTime*(0.6+sz)+position.x*3.0); gl_PointSize=sz*uScale/-mv.z*0.9; gl_Position=projectionMatrix*mv; }',
      fragmentShader: 'varying vec3 vC; varying float vA; void main(){ float d=length(gl_PointCoord-0.5)*2.0; float a=smoothstep(1.0,0.2,d); gl_FragColor=vec4(vC*a*vA*0.9,1.0); }',
    });
    var stars = new THREE.Points(g, m); stars.frustumCulled = false; scene.add(stars);
    var starU = m.uniforms;
  }

  /* ---------- camera: orbit with one finger, zoom with two, follow a planet when tapped ---------- */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
  const cam = new THREE.PerspectiveCamera(36, 1, .1, 400);
  const view = { yaw: .7, pitch: .62, dist: 80, tYaw: .7, tPitch: .62, tDist: 80, auto: true };
  const HOME = { yaw: .7, pitch: .62, dist: 80 };
  let vw = 1, vh = 1, avail = 1;
  const target = new THREE.Vector3(), tgtGoal = new THREE.Vector3(), tmp = new THREE.Vector3();
  let lastReset = LO.reset, followE = 0;
  function placeCamera(now, dtc) {
    if (LO.reset !== lastReset) { lastReset = LO.reset; view.tYaw = HOME.yaw; view.tPitch = HOME.pitch; view.tDist = HOME.dist; view.auto = true; }
    const k = reduce ? 1 : 1 - Math.exp(-dtc / .28);
    if (view.auto && !reduce) view.tYaw += dtc * .05;
    view.yaw += (view.tYaw - view.yaw) * k; view.pitch += (view.tPitch - view.pitch) * k; view.dist += (view.tDist - view.dist) * k;
    const f = LO.follow ? bodies.find(x => x.b === LO.follow) : null;
    followE += ((f ? 1 : 0) - followE) * k;
    if (f) { f.tiltG.getWorldPosition(tgtGoal); } else tgtGoal.set(0, 1.2, 0);
    target.lerp(tgtGoal, f ? Math.min(1, k * 1.5) : k);
    const d = f ? lerp(view.dist, f.b.r * 7 + 2.5, followE) : view.dist;
    cam.position.set(target.x + d * Math.cos(view.pitch) * Math.sin(view.yaw), target.y + d * Math.sin(view.pitch), target.z + d * Math.cos(view.pitch) * Math.cos(view.yaw));
    cam.lookAt(target); cam.updateMatrixWorld();
  }

  /* ---------- post: a gentle bloom and a vignette ---------- */
  let pr = Math.min(window.devicePixelRatio || 1, 1.5);
  const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 }));
  composer.addPass(new RenderPass(scene, cam));
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), .5, .7, .78);
  composer.addPass(bloom);
  const vig = new ShaderPass({
    uniforms: { tDiffuse: { value: null } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c=texture2D(tDiffuse,vUv); c.rgb*=mix(1.0,0.72,smoothstep(0.45,1.0,length((vUv-0.5)*vec2(1.1,1.0)))); gl_FragColor=c; }',
  });
  composer.addPass(vig);
  composer.addPass(new OutputPass());

  function resize() {
    vw = innerWidth; vh = innerHeight; avail = Math.min(vh, LO.availH());
    // shift the projection so the model centers in the space above the dock
    const fullH = 2 * vh - avail, oy = vh - avail;
    cam.aspect = vw / fullH; cam.fov = 2 * Math.atan(Math.tan(18 * Math.PI / 180) * fullH / vh) * 180 / Math.PI;
    cam.setViewOffset(vw, fullH, 0, oy, vw, vh); cam.updateProjectionMatrix();
    // far enough that the whole plinth fits in the space above the dock, whichever way is narrower
    HOME.dist = 1.1 * outer / (Math.tan(18 * Math.PI / 180) * Math.min(avail, vw) / vh);
    if (view.auto && !LO.follow) view.tDist = HOME.dist;
    renderer.setPixelRatio(pr); renderer.setSize(vw, vh, false);
    composer.setPixelRatio(pr); composer.setSize(vw, vh);
    starU.uScale.value = vh * pr / 2;
  }
  resize();
  addEventListener('resize', resize);
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(document.getElementById('dock'));

  /* ---------- touch ---------- */
  const canvas = renderer.domElement, ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const ptrs = new Map(); let moved = 0, pinch0 = 0, dist0 = 0, downT = 0;
  const pick = e => {
    ndc.set(e.clientX / vw * 2 - 1, -(e.clientY / vh) * 2 + 1); ray.setFromCamera(ndc, cam);
    // a generous hit area: the nearest body whose screen-space distance is within a thumb
    let best = null, bd = 1e9;
    for (const x of [{ b: S, mesh: sun }, ...bodies]) {
      x.mesh.getWorldPosition(tmp); const r = x.b.r; const dist = ray.ray.distanceToPoint(tmp); const camD = tmp.distanceTo(cam.position);
      const px = dist / camD * (vh / 2) / Math.tan(cam.fov * Math.PI / 360);
      const rpx = r / camD * (vh / 2) / Math.tan(cam.fov * Math.PI / 360);
      if (px < Math.max(rpx + 6, 26) && camD < bd) { best = x; bd = camD; }
    }
    return best;
  };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; downT = performance.now();
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); dist0 = view.tDist; }
  });
  canvas.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if (!p) { if (e.pointerType === 'mouse') canvas.style.cursor = pick(e) ? 'pointer' : 'grab'; return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy);
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 1) { view.tYaw -= dx * .006; view.tPitch = clamp(view.tPitch + dy * .005, .08, 1.45); view.auto = false; }
    else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0 > 0) view.tDist = clamp(dist0 * pinch0 / d, 6, 180); }
  });
  const endPtr = e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (ptrs.size === 0 && moved < 8 && performance.now() - downT < 400) {
      const hit = pick(e);
      if (hit && hit.b !== S) { LO.follow = hit.b; LO.showCard(hit.b); }
      else if (hit) { LO.follow = null; LO.showCard(S); }
      else if (LO.follow) { LO.follow = null; LO.showCard(null); }
    }
    if (ptrs.size === 1) pinch0 = 0;
  };
  canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr); canvas.addEventListener('lostpointercapture', endPtr);
  canvas.addEventListener('wheel', e => { e.preventDefault(); view.tDist = clamp(view.tDist * (1 + e.deltaY * .0015), 6, 180); }, { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  /* ---------- labels: planet names projected to the screen ---------- */
  const labelsEl = document.getElementById('labels');
  const labs = [{ b: S, mesh: sun }, ...bodies].map(x => { const d = document.createElement('div'); d.className = 'lab'; d.textContent = x.b.name; labelsEl.append(d); return { x, d }; });
  function placeLabels() {
    for (const { x, d } of labs) {
      if (!LO.labels) { d.classList.remove('on'); continue; }
      x.mesh.getWorldPosition(tmp); tmp.y += x.b.r * 1.25 + .3;
      const camD = tmp.distanceTo(cam.position); tmp.project(cam);
      const on = tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05;
      d.classList.toggle('on', on);
      if (on) d.style.transform = 'translate(' + ((tmp.x + 1) / 2 * vw).toFixed(1) + 'px,' + ((1 - tmp.y) / 2 * vh).toFixed(1) + 'px) translate(-50%,-100%)';
    }
  }

  /* ---------- frame loop, with a step down in quality if the device struggles ---------- */
  let first = true, lastT = performance.now(), fc = 0, fAcc = 0, fN = 0, tier = 0, simT = 0, clockAcc = 0;
  const fpsEl = /[?&]fps\b/.test(location.search) ? document.getElementById('clock') : null;
  function frame(now) {
    const dt = Math.min(.1, Math.max(0, (now - lastT) / 1000)); lastT = now; fc++;
    if (!LO.paused) {
      const dy = dt / LO.yearSec; // years that pass this frame
      LO.years += dy;
      for (const x of bodies) {
        x.pivot.rotation.y += dy * Math.PI * 2 / x.b.year;
        x.mesh.rotation.y += dy * 365.25 / x.b.day * Math.PI * 2 * .02; // spin is slowed 50x so it stays readable
        if (x.moonPivot) x.moonPivot.rotation.y += dy * 365.25 / 27.3 * Math.PI * 2;
      }
      sun.rotation.y += dy * 365.25 / S.day * Math.PI * 2 * .02;
      clockAcc += dt; if (clockAcc > .25) { clockAcc = 0; if (!fpsEl) LO.tickClock(); }
    }
    for (const x of orbitRings) x.visible = LO.orbits;
    placeCamera(now, dt);
    if (!reduce) starU.uTime.value = now / 1000;
    halo.material.opacity = .5 + .1 * Math.sin(now / 900);
    composer.render();
    placeLabels();
    if (first) { first = false; LO.ready = true; document.getElementById('loading').classList.add('done'); }
    if (fc > 40 && dt < .2) {
      fAcc += dt * 1000; fN++;
      if (fN === 90) {
        const ms = fAcc / fN;
        if (fpsEl) fpsEl.textContent = Math.round(1000 / ms) + ' fps · tier ' + tier;
        if (ms > 24 && tier < 3) {
          tier++;
          if (tier === 1 && pr > 1) { pr = 1; resize(); }
          else if (tier <= 2) { tier = 2; bloom.enabled = false; }
          else { pr = Math.min(pr, .75); resize(); }
        }
        fAcc = 0; fN = 0;
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
} catch (err) {
  if (err && err.message !== 'skip') console.warn('3D model unavailable:', err);
  if (LO) LO.fail();
}
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
